<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Kubernetes ValidatingAdmissionPolicy CEL Security Guide">
<title>Kubernetes CEL ValidatingAdmissionPolicy Security Guide</title>
<defs>
  <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#070D1E"/>
    <stop offset="50%" stop-color="#0B1736"/>
    <stop offset="100%" stop-color="#10204C"/>
  </linearGradient>
  <linearGradient id="k8sBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#326CE5"/>
    <stop offset="100%" stop-color="#60A5FA"/>
  </linearGradient>
  <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#0E1E45"/>
    <stop offset="100%" stop-color="#09132C"/>
  </linearGradient>
  <radialGradient id="glowGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#326CE5" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#326CE5" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dotGrid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="15" cy="15" r="0.9" fill="#2E4374" opacity="0.6"/>
  </pattern>
</defs>

<rect width="1200" height="630" fill="url(#bgGradient)"/>
<rect width="1200" height="630" fill="url(#dotGrid)"/>
<circle cx="280" cy="280" r="260" fill="url(#glowGlow)"/>
<circle cx="960" cy="380" r="220" fill="url(#greenGlow)"/>

<rect x="0" y="0" width="1200" height="54" fill="#040813" opacity="0.95"/>
<text x="40" y="35" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#60A5FA" letter-spacing="2.5">KUBERNETES DEVSECOPS</text>
<text x="1160" y="35" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#94A3B8" letter-spacing="1" text-anchor="end">v1.31+ IN-TREE ADMISSION</text>
<rect x="0" y="52" width="1200" height="2" fill="url(#k8sBlueGrad)"/>

<g transform="translate(60, 95)">
  <rect x="0" y="0" width="680" height="480" rx="14" fill="url(#cardGrad)" stroke="#2563EB" stroke-width="1.8"/>
  
  <rect x="36" y="36" width="170" height="26" rx="13" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
  <text x="121" y="53" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#93C5FD" text-anchor="middle" letter-spacing="1.5">SECURITY GUIDE</text>
  
  <text x="36" y="105" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">ValidatingAdmissionPolicy</text>
  <text x="36" y="145" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#60A5FA">CEL-Based In-Tree Policy Engine</text>
  
  <g transform="translate(36, 175)">
    <rect x="0" y="0" width="608" height="200" rx="8" fill="#060C1B" stroke="#1D4ED8" stroke-width="1"/>
    <text x="20" y="32" font-family="Courier, monospace" font-size="14" font-weight="700" fill="#F43F5E">apiVersion: <tspan fill="#E2E8F0">admissionregistration.k8s.io/v1</tspan></text>
    <text x="20" y="58" font-family="Courier, monospace" font-size="14" font-weight="700" fill="#F43F5E">kind: <tspan fill="#38BDF8">ValidatingAdmissionPolicy</tspan></text>
    <text x="20" y="84" font-family="Courier, monospace" font-size="14" font-weight="700" fill="#F43F5E">spec:</text>
    <text x="40" y="110" font-family="Courier, monospace" font-size="14" font-weight="600" fill="#94A3B8">validations:</text>
    <text x="60" y="136" font-family="Courier, monospace" font-size="13" font-weight="600" fill="#34D399">- expression: "object.spec.containers.all(c, !c.securityContext.privileged)"</text>
    <text x="75" y="162" font-family="Courier, monospace" font-size="13" font-weight="600" fill="#FBBF24">message: "Privileged containers are strictly forbidden in production."</text>
  </g>
  
  <g transform="translate(36, 405)">
    <rect x="0" y="0" width="180" height="34" rx="6" fill="#111E38" stroke="#3B82F6" stroke-width="1"/>
    <text x="90" y="22" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#93C5FD" text-anchor="middle">Zero Webhook Latency</text>
    
    <rect x="200" y="0" width="180" height="34" rx="6" fill="#111E38" stroke="#10B981" stroke-width="1"/>
    <text x="290" y="22" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">Type-Safe CEL Logic</text>

    <rect x="400" y="0" width="180" height="34" rx="6" fill="#111E38" stroke="#A855F7" stroke-width="1"/>
    <text x="490" y="22" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#D8B4FE" text-anchor="middle">Fail-Closed Security</text>
  </g>
</g>

<g transform="translate(770, 95)">
  <rect x="0" y="0" width="370" height="230" rx="14" fill="url(#cardGrad)" stroke="#1D4ED8" stroke-width="1.4"/>
  <text x="24" y="34" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#60A5FA" letter-spacing="1.5">ARCHITECTURE FLOW</text>
  
  <g transform="translate(24, 55)">
    <rect x="0" y="0" width="110" height="40" rx="6" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="55" y="24" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">kube-apiserver</text>
    
    <line x1="115" y1="20" x2="145" y2="20" stroke="#60A5FA" stroke-width="2"/>
    
    <rect x="150" y="0" width="165" height="40" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
    <text x="232" y="24" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#A7F3D0" text-anchor="middle">In-Process CEL Engine</text>
    
    <g transform="translate(0, 75)" opacity="0.7">
      <rect x="0" y="0" width="315" height="46" rx="6" fill="#1E1E2F" stroke="#EF4444" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="15" y="28" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#FCA5A5">Legacy Webhook: Network Roundtrip</text>
      <line x1="10" y1="23" x2="305" y2="23" stroke="#EF4444" stroke-width="2"/>
    </g>
  </g>
  
  <g transform="translate(0, 250)">
    <rect x="0" y="0" width="370" height="230" rx="14" fill="url(#cardGrad)" stroke="#1D4ED8" stroke-width="1.4"/>
    <text x="24" y="34" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#34D399" letter-spacing="1.5">PERFORMANCE IMPACT</text>
    
    <g transform="translate(24, 60)">
      <text x="0" y="25" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="900" fill="#34D399">&lt; 1 ms</text>
      <text x="0" y="48" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#94A3B8">In-Memory Policy Evaluation Latency</text>
      
      <line x1="0" y1="70" x2="320" y2="70" stroke="#1E293B" stroke-width="1"/>
      
      <text x="0" y="105" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="900" fill="#60A5FA">0 Webhooks</text>
      <text x="0" y="128" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#94A3B8">Eliminates External Webhook Outages</text>
    </g>
  </g>
</g>
</svg>
