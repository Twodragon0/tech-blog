<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="AI Agent MCP Server Security Threat Modeling and Defense Guide">
<title>AI Agent MCP Server Security Threat Modeling and Defense Guide</title>
<defs>
  <linearGradient id="bgGradAI" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#08071A"/>
    <stop offset="50%" stop-color="#120E2E"/>
    <stop offset="100%" stop-color="#1B0F38"/>
  </linearGradient>
  <linearGradient id="neonPurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#A855F7"/>
    <stop offset="100%" stop-color="#EC4899"/>
  </linearGradient>
  <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#06B6D4"/>
    <stop offset="100%" stop-color="#3B82F6"/>
  </linearGradient>
  <linearGradient id="panelGradAI" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#1C1438"/>
    <stop offset="100%" stop-color="#0F0A24"/>
  </linearGradient>
  <radialGradient id="purpleGlowAI" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#A855F7" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="cyanGlowAI" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
  </radialGradient>
  <pattern id="gridAI" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
    <circle cx="16" cy="16" r="0.9" fill="#3B2D60" opacity="0.6"/>
  </pattern>
</defs>

<rect width="1200" height="630" fill="url(#bgGradAI)"/>
<rect width="1200" height="630" fill="url(#gridAI)"/>
<circle cx="280" cy="260" r="250" fill="url(#purpleGlowAI)"/>
<circle cx="960" cy="380" r="230" fill="url(#cyanGlowAI)"/>

<rect x="0" y="0" width="1200" height="54" fill="#060412" opacity="0.95"/>
<text x="40" y="35" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#C084FC" letter-spacing="2.5">AI AGENT &amp; LLM SECURITY</text>
<text x="1160" y="35" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#94A3B8" letter-spacing="1" text-anchor="end">MCP DEFENSE ARCHITECTURE</text>
<rect x="0" y="52" width="1200" height="2" fill="url(#neonPurpleGrad)"/>

<!-- Left Hero Panel -->
<g transform="translate(60, 95)">
  <rect x="0" y="0" width="680" height="480" rx="14" fill="url(#panelGradAI)" stroke="#A855F7" stroke-width="1.6"/>
  
  <rect x="36" y="36" width="190" height="26" rx="13" fill="#2E1065" stroke="#A855F7" stroke-width="1"/>
  <text x="131" y="53" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#E9D5FF" text-anchor="middle" letter-spacing="1.5">THREAT MODEL &amp; DEFENSE</text>
  
  <text x="36" y="105" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">MCP Server Security Guide</text>
  <text x="36" y="145" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#C084FC">Guarding Against Tool Poisoning &amp; Injection</text>
  
  <!-- Config Snippet Box -->
  <g transform="translate(36, 175)">
    <rect x="0" y="0" width="608" height="200" rx="8" fill="#0A0618" stroke="#4C1D95" stroke-width="1"/>
    <text x="20" y="32" font-family="Courier, monospace" font-size="13" font-weight="700" fill="#F43F5E">"mcpServers": <tspan fill="#E2E8F0">{ "sandboxed-executor": {</tspan></text>
    <text x="40" y="58" font-family="Courier, monospace" font-size="13" font-weight="600" fill="#38BDF8">"command": <tspan fill="#34D399">"gvisor-sandbox-runner"</tspan>,</text>
    <text x="40" y="84" font-family="Courier, monospace" font-size="13" font-weight="600" fill="#38BDF8">"allowed_tools": <tspan fill="#FBBF24">["read_file", "search_ast"]</tspan>,</text>
    <text x="40" y="110" font-family="Courier, monospace" font-size="13" font-weight="600" fill="#38BDF8">"egress_policy": <tspan fill="#F43F5E">"deny-all-except-internal-registry"</tspan>,</text>
    <text x="40" y="136" font-family="Courier, monospace" font-size="13" font-weight="600" fill="#38BDF8">"require_human_approval": <tspan fill="#A855F7">true</tspan></text>
    <text x="20" y="162" font-family="Courier, monospace" font-size="13" font-weight="700" fill="#E2E8F0">} }</text>
  </g>
  
  <!-- Badges -->
  <g transform="translate(36, 405)">
    <rect x="0" y="0" width="180" height="34" rx="6" fill="#1E1035" stroke="#A855F7" stroke-width="1"/>
    <text x="90" y="22" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#E9D5FF" text-anchor="middle">Tool Poisoning Defense</text>
    
    <rect x="200" y="0" width="180" height="34" rx="6" fill="#0C2538" stroke="#06B6D4" stroke-width="1"/>
    <text x="290" y="22" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#A5F3FC" text-anchor="middle">gVisor Micro-Sandboxing</text>

    <rect x="400" y="0" width="180" height="34" rx="6" fill="#142A1D" stroke="#10B981" stroke-width="1"/>
    <text x="490" y="22" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">Egress Air-Gap Control</text>
  </g>
</g>

<!-- Right Side Control Tower -->
<g transform="translate(770, 95)">
  <rect x="0" y="0" width="370" height="230" rx="14" fill="url(#panelGradAI)" stroke="#4C1D95" stroke-width="1.4"/>
  <text x="24" y="34" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#C084FC" letter-spacing="1.5">ATTACK VECTOR FLOW</text>
  
  <g transform="translate(24, 55)">
    <rect x="0" y="0" width="130" height="38" rx="6" fill="#2E1065" stroke="#A855F7" stroke-width="1.2"/>
    <text x="65" y="23" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#E9D5FF" text-anchor="middle">Untrusted Prompt / Doc</text>
    
    <line x1="135" y1="19" x2="165" y2="19" stroke="#EC4899" stroke-width="2"/>
    
    <rect x="170" y="0" width="150" height="38" rx="6" fill="#3B071A" stroke="#F43F5E" stroke-width="1.2"/>
    <text x="245" y="23" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#FECDD3" text-anchor="middle">Indirect Prompt Injection</text>
    
    <g transform="translate(0, 65)">
      <rect x="0" y="0" width="320" height="50" rx="6" fill="#080414" stroke="#06B6D4" stroke-width="1"/>
      <text x="15" y="22" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#38BDF8">HITL &amp; Sandboxed Execution</text>
      <text x="15" y="38" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="500" fill="#94A3B8">Blocks unauthorized exfiltration &amp; tool call</text>
    </g>
  </g>
  
  <g transform="translate(0, 250)">
    <rect x="0" y="0" width="370" height="230" rx="14" fill="url(#panelGradAI)" stroke="#4C1D95" stroke-width="1.4"/>
    <text x="24" y="34" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#34D399" letter-spacing="1.5">SECURITY RESILIENCE</text>
    
    <g transform="translate(24, 60)">
      <text x="0" y="25" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="900" fill="#06B6D4">Least-Privilege</text>
      <text x="0" y="48" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#94A3B8">Granular Tool Scoping per Agent</text>
      
      <line x1="0" y1="70" x2="320" y2="70" stroke="#2D1F4E" stroke-width="1"/>
      
      <text x="0" y="105" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="900" fill="#A855F7">0 Data Leakage</text>
      <text x="0" y="128" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#94A3B8">Network Egress Whitelist &amp; Masking</text>
    </g>
  </g>
</g>
</svg>
