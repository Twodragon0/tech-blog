# pyproject.toml

[tool.ruff]
# Black-compatible code formatter
line-length = 88
indent-width = 4

# The oldest Python any workflow pins for scripts/ (measured 2026-08-24: 3.11 in
# jekyll.yml, svg-lint.yml, ai-blogwatcher.yml and ten others). Local
# interpreters here are 3.13/3.14, so without this ruff accepts syntax CI cannot
# parse — PR #599 shipped a backslash inside an f-string expression (legal from
# 3.12, PEP 701) that passed the whole local suite and then aborted CI test
# COLLECTION, taking all 4319 tests down instead of failing one.
# `ast.parse(feature_version=(3, 11))` does NOT catch this; ruff does.
# Kept in sync with the workflows by test_ci_python_syntax_floor_guard.py.
target-version = "py311"

# Exclude directories from linting/formatting
exclude = [
    ".bundle",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "_site",
    "api", # JavaScript
    "vendor",
    "scripts/_archive",
]

[tool.ruff.lint]
# E = pycodestyle errors, F = Pyflakes, W = pycodestyle warnings, I = isort
select = ["E", "F", "W", "I"]
# E501: Line too long - disabled due to Korean text and SVG templates
# W291/W293: Trailing/leading whitespace in string literals
# E722: Bare except - common in legacy scripts with broad error handling
# E741: Ambiguous variable name - legacy code
# E402: Import not at top - scripts with sys.path manipulation
# E701: Multiple statements on one line
# F841: Unused variable - legacy scripts with side effects
# F601: Redundant membership test
# F401: Unused import - many in try/except fallback blocks
ignore = ["E501", "W291", "W293", "E722", "E741", "E402", "E701", "F841", "F601", "F401"]

[tool.ruff.format]
# Black-compatible formatter
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Exclude files from formatting
exclude = [
    "scripts/requirements.txt",
]


[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
exclude = ["vendor/", "node_modules/", "_site/", "scripts/_archive/"]

# More strict checking (can be enabled progressively)
# disallow_untyped_defs = true
# disallow_any_unimported = true
# no_implicit_optional = true
# check_untyped_defs = true
# warn_return_any = true
# warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["scripts"]

[tool.coverage.report]
# This `include` list narrows EVERY downstream report — the terminal table,
# coverage.json, the PR comment, and `fail_under` below — to 17 files / 4,755
# statements at 72% (measured 2026-09-10). `scripts/` actually holds 218 files
# and 34,747 statements at 39.76%, so this slice is 13.7% of the code and a new
# 500-line untested module cannot move the number at all.
#
# That is deliberate now rather than accidental: this is the CORE ratchet, and
# `.coveragerc-global` carries a second floor over everything. Keep both. A
# global-only floor would hide a regression in the well-tested modules here
# (content_generator sits at 84%) inside the rounding; a core-only floor is what
# let ~30,000 statements go unwatched.
include = [
    "scripts/auto_publish_news.py",
    "scripts/check_posts.py",
    "scripts/fix_links_unified.py",
    "scripts/verify_images_unified.py",
    "scripts/regenerate_all_images.py",
    "scripts/regenerate_digest_svgs.py",
    "scripts/lib/*.py",
    "scripts/news/content_generator.py",
    "scripts/news_utils.py",
]
show_missing = true
# Note: raising this threshold is a ratchet. Lower it only when adding large
# untested modules to the include list; otherwise prefer adding tests to meet
# the existing bar.
#
# This is the ONLY place the core floor is set. jekyll.yml used to pass
# `--cov-fail-under=40` on the pytest line, and the CLI flag wins — so CI
# enforced 40 while this file, which is what anyone reads, said 50. The flag is
# gone. Measured headroom on 2026-09-10: 72.13% against this 50.
fail_under = 50
