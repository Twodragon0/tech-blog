# Dependabot configuration
# Automatic security + version updates for bundler, npm, github-actions, pip.
#
# Coverage must stay in sync with the dependency graph. Every manifest GitHub
# detects should be claimed by exactly one entry below; otherwise it shows up
# in Insights > Dependency graph but never receives an update PR.
#
#   Gemfile / Gemfile.lock          -> bundler  "/"
#   package.json / package-lock.json-> npm      "/"
#   .github/workflows/*.yml         -> github-actions "/"
#   requirements-blogwatcher.txt    \
#   requirements-gsc.txt             |-> pip    "/"
#   requirements-visual.txt         /
#   scripts/requirements.txt        \
#   scripts/requirements-ci.txt     /-> pip    "/scripts"
#
# Reviewers are intentionally NOT set here — the `reviewers` key is deprecated
# and .github/CODEOWNERS assigns review on every PR instead.
version: 2
updates:
  # Ruby (Bundler) updates
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    groups:
      ruby-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "ruby"
    commit-message:
      prefix: "deps(ruby)"
      include: "scope"

  # JavaScript (npm) updates
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    groups:
      js-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps(js)"
      include: "scope"

  # GitHub Actions updates
  #
  # SHA-pinned third-party actions (peter-evans/*, ruby/setup-ruby) and
  # GitHub-owned actions/* are bumped automatically. Updates are grouped
  # so 24+ pinned references don't generate a separate PR per action
  # each week.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps(actions)"
      include: "scope"

  # Python (pip) updates — automation scripts
  - package-ecosystem: "pip"
    directory: "/scripts"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    groups:
      py-scripts-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Pillow majors are held back by moviepy, not by preference.
      #
      # moviepy 2.2.1 (latest on 2026-08-18) declares
      # `Requires-Dist: pillow<12.0,>=9.2.0`, and every 2.x release does the
      # same — `pip install 'moviepy>=2.0' 'Pillow>=12.3.0'` is
      # ResolutionImpossible. Allowing Pillow 12 here does not fail loudly:
      # pip resolves moviepy DOWN to 1.0.3 instead, whose __init__.py exports
      # only __version__. scripts/generate_post_images.py:100 does
      # `from moviepy import AudioFileClip, ImageClip, concatenate_videoclips`
      # (the 2.x top-level API), that import raises, and because it sits in a
      # try/except the only symptom is video generation silently stopping with
      # CI still green. PR #488 was exactly this.
      #
      # Remove this once moviepy ships a release allowing pillow>=12; re-check
      # with `pip install --dry-run 'moviepy>=2.0' 'Pillow>=12.0'`.
      - dependency-name: "Pillow"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(py)"
      include: "scope"

  # Python (pip) updates — root-level workflow requirement sets.
  # requirements-blogwatcher.txt / requirements-gsc.txt / requirements-visual.txt
  # are installed by GitHub Actions (ai-blogwatcher, gsc-queue-refresh,
  # visual-regression). Without this entry they appear in the dependency graph
  # but receive no version or security update PRs.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    groups:
      py-root-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(py)"
      include: "scope"
