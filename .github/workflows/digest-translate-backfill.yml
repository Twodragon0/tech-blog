name: Digest Translate Backfill

# 재발 방지 B단계 — TRUSTED post-processing translator.
#
# The untrusted `repository_dispatch` publish path in ai-blogwatcher.yml zeroes
# out all LLM keys (MED-1 secret partition), so any digest it publishes with an
# English-only translation fallback lands untranslated. This job runs in a
# TRUSTED context (schedule / manual dispatch ONLY — never repository_dispatch)
# WITH the keys available, translates those English 요약/summary=/title= spans
# back to Korean (scripts/retranslate_digest.py), and opens a review PR.
#
# Why this is safe even though the post text originated from untrusted RSS:
# the key is never exposed to a dispatch requester (this workflow cannot be
# triggered by repository_dispatch, and the translate step is additionally
# guarded on github.event_name); the LLM output can only become validated
# Korean post text (no tool/network/eval surface); and retranslate_digest.py
# validates every translation (Hangul present, bounded length) before writing.
# See notes/digest-retranslate-security.md.

on:
  schedule:
    # 01:30 UTC (10:30 KST) — ~90 min after the ai-blogwatcher publish cron
    # (0 0 * * *) so a freshly-published digest is already committed.
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "Translate digests changed within this many recent commits"
        required: false
        default: "5"
      dry_run:
        description: "Dry run (no write, no PR)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions: {}

concurrency:
  group: digest-translate-backfill
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"

jobs:
  translate-backfill:
    # Belt-and-suspenders: this workflow has no repository_dispatch trigger, but
    # pin the whole job to the trusted event types so a future edit that adds one
    # can never run the secret-injecting steps below.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write
      pull-requests: write
      # issues: write is the fallback signal channel. When the repo setting blocks
      # Actions from opening PRs, the translations still get recorded in a
      # self-updating tracking issue instead of vanishing behind a red cron.
      issues: write

    env:
      SINCE: ${{ github.event.inputs.since || '5' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 10

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "requirements-blogwatcher.txt"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # requests (DeepSeek/Gemini REST) comes from the reviewed, floor-pinned
          # blogwatcher dep set.
          pip install -r requirements-blogwatcher.txt

      - name: Retranslate untranslated digests
        id: translate
        env:
          # SECRET PARTITION (mirrors ai-blogwatcher.yml MED-1): inject the LLM
          # keys ONLY on the trusted event types. Even though this workflow has no
          # repository_dispatch trigger, the guard makes a future misconfiguration
          # fail-closed (empty key -> retranslate_digest.py is a clean no-op).
          GEMINI_API_KEY: ${{ github.event_name != 'repository_dispatch' && secrets.GEMINI_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ github.event_name != 'repository_dispatch' && secrets.DEEPSEEK_API_KEY || '' }}
          # Force auto mode so both backends are eligible (config._AI_MODE).
          AUTO_PUBLISH_USE_AI: "auto"
        run: |
          set -euo pipefail
          # Only strictly-numeric SINCE is honored (no shell metacharacters).
          if [[ "${SINCE}" =~ ^[0-9]+$ ]] && [ "${SINCE}" -gt 0 ]; then
            BASE="HEAD~${SINCE}"
          else
            BASE="HEAD~5"
          fi
          echo "Scanning digests changed vs ${BASE} ..."

          ARGS=(--changed "${BASE}")
          if [ "${DRY_RUN}" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          # retranslate_digest.py masks nothing sensitive to stdout and is a
          # clean no-op when no key is present.
          python3 scripts/retranslate_digest.py "${ARGS[@]}"

          if [ "${DRY_RUN}" != "true" ] && ! git diff --quiet -- _posts; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open review PR with translations
        id: open_pr
        if: steps.translate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          TODAY=$(date -u +%Y-%m-%d)
          BRANCH="digest-retranslate/${TODAY}-${RUN_ID}"
          git checkout -b "$BRANCH"
          git add -u _posts/
          git commit -m "fix: 미번역 영문 다이제스트 요약/제목 한국어 재번역 (${TODAY})"
          git push origin "$BRANCH"

          # Do NOT push to main — open a PR so CI (digest gates) runs first.
          # Mirror the blogwatcher graceful-degrade: if the repo blocks Actions
          # from opening PRs, leave the branch pushed and print how to open it.
          if gh pr create --base main --head "$BRANCH" \
            --title "fix: 미번역 다이제스트 한국어 재번역 (${TODAY})" \
            --body "재발 방지 B단계 — trusted scheduled translator retranslated English-fallback 요약/summary=/title= spans back to Korean. Translations are output-validated (Hangul + bounded length). Review the diff and let CI go green before merging."; then
            echo "Opened retranslate review PR from $BRANCH"
          else
            # This is the degraded path, and it is reached in practice: the repo
            # setting "Allow GitHub Actions to create and approve pull requests" is
            # off, so `gh pr create` returns
            #   GraphQL: GitHub Actions is not permitted to create or approve pull requests
            #
            # It used to `exit 1` here. Measured 2026-08-08..10: three consecutive
            # daily failures, and because the step is only reached when there is
            # something to translate (it was `skipped` on every earlier run), its
            # first real execution was also its first failure — a step that had never
            # run had never been verified. Nobody acted on the red for three days
            # while three branches accumulated, and each day re-translated the same
            # headline to a slightly different Korean string.
            #
            # A daily red that strands work is not a signal, it is noise that gets
            # muted. So: leave the branch pushed (work is never lost), record it in a
            # single self-updating issue (Actions may create issues even when it may
            # not create PRs), and exit 0. The issue is the durable signal; the
            # branch list in it grows until someone merges.
            COMPARE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
            echo "::warning::Actions is not permitted to open PRs; translations are on branch '${BRANCH}' (main NOT updated). A tracking issue is updated instead."
            echo "::warning::  $COMPARE_URL"
            {
              echo "### Retranslation awaiting review"
              echo ""
              echo "- Branch: \`${BRANCH}\`"
              echo "- [Open the PR manually]($COMPARE_URL)"
              echo ""
              echo "Auto-opening is blocked by Settings → Actions → General →"
              echo "'Allow GitHub Actions to create and approve pull requests'."
            } >> "$GITHUB_STEP_SUMMARY"
            {
              echo "stranded=true"
              echo "stranded_branch=$BRANCH"
              echo "compare_url=$COMPARE_URL"
            } >> "$GITHUB_OUTPUT"
          fi

      # Durable signal for the degraded path above. Actions may create issues even
      # where it may not create pull requests, so a stranded branch is recorded in
      # ONE self-updating issue rather than a red cron run nobody reads. The issue
      # is found by a hidden marker (not by title), so renaming the title later does
      # not fork it into duplicates.
      - name: Track stranded translations in an issue
        if: steps.open_pr.outputs.stranded == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          STRANDED_BRANCH: ${{ steps.open_pr.outputs.stranded_branch }}
          COMPARE_URL: ${{ steps.open_pr.outputs.compare_url }}
        with:
          script: |
            const MARKER = '<!-- digest-retranslate-stranded -->';
            const branch = process.env.STRANDED_BRANCH;
            const compare = process.env.COMPARE_URL;
            const entry = `- [ ] \`${branch}\` — [open PR](${compare})`;

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automation',
              per_page: 100,
            });
            const existing = open.find((i) => (i.body || '').includes(MARKER));

            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Digest retranslations awaiting review (auto-PR blocked)',
                labels: ['automation'],
                body: [
                  MARKER,
                  '',
                  'The scheduled digest retranslator produced changes but could not open a PR:',
                  'Settings → Actions → General → "Allow GitHub Actions to create and approve',
                  'pull requests" is off, and GITHUB_TOKEN cannot be granted that permission.',
                  '',
                  'Each branch below holds validated translations and is NOT on main. Merge them',
                  'and tick the box; this issue closes itself once every box is ticked or the',
                  'branches are gone.',
                  '',
                  entry,
                ].join('\n'),
              });
              return;
            }

            if ((existing.body || '').includes(branch)) {
              core.info(`branch ${branch} already tracked in #${existing.number}`);
              return;
            }
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: `${existing.body}\n${entry}`,
            });
            core.info(`appended ${branch} to #${existing.number}`);

      - name: Summary
        if: always()
        run: |
          {
            echo "## Digest Translate Backfill"
            echo ""
            echo "- Event: ${{ github.event_name }}"
            echo "- Since: ${SINCE} commit(s)"
            echo "- Dry run: ${DRY_RUN}"
            echo "- Changes: ${{ steps.translate.outputs.changed }}"
          } >> "$GITHUB_STEP_SUMMARY"
