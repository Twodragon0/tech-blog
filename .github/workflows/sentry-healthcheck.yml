name: Sentry Healthcheck

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      strict_sentry_app:
        description: "Fail when Sentry GitHub App evidence is not found"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  checks: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sentry-healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # M-audit: 시크릿은 job-level이 아닌 이를 실제로 쓰는 step에만 노출.
    # 비-시크릿(STRICT_SENTRY_APP, DEFAULT_BRANCH)만 job-level 유지.
    env:
      STRICT_SENTRY_APP: ${{ github.event.inputs.strict_sentry_app || 'false' }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Validate Sentry token and project access
        id: token
        env:
          SENTRY_MONITOR_MODE: ${{ vars.SENTRY_MONITOR_MODE || 'shared' }}
          SENTRY_AUTH_TOKEN: ${{ (vars.SENTRY_MONITOR_MODE == '' || vars.SENTRY_MONITOR_MODE == 'shared') && secrets.SENTRY_AUTH_TOKEN || '' }}
          SENTRY_MONITOR_AUTH_TOKEN: ${{ vars.SENTRY_MONITOR_MODE == 'dedicated' && secrets.SENTRY_MONITOR_AUTH_TOKEN || '' }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          if ! python3 scripts/lib/sentry_monitor.py health; then
            exit 1
          fi

      - name: Check GitHub App evidence for Sentry integration
        id: app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="${DEFAULT_BRANCH:-main}"
          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${branch}" --jq .sha)
          gh api "repos/${GITHUB_REPOSITORY}/commits/${main_sha}/check-runs" > /tmp/check-runs.json

          result=$(python3 -c "import json; from pathlib import Path; payload=json.loads(Path('/tmp/check-runs.json').read_text(encoding='utf-8')); checks=payload.get('check_runs', []); matches=[((c.get('app') or {}).get('slug',''), (c.get('app') or {}).get('name',''), c.get('name','')) for c in checks if 'sentry' in (((c.get('app') or {}).get('slug','')).lower()) or 'sentry' in (((c.get('app') or {}).get('name','')).lower())]; print('FOUND' if matches else 'NOT_FOUND'); [print(f'- app.slug={s}, app.name={n}, check={k}') for s,n,k in matches]")

          echo "$result"
          if [ "$(echo "$result" | head -n1)" = "FOUND" ]; then
            echo "app_detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "app_detected=false" >> "$GITHUB_OUTPUT"
            if [ "${STRICT_SENTRY_APP}" = "true" ]; then
              echo "❌ No Sentry GitHub App evidence found in recent checks on ${branch}"
              exit 1
            fi
            echo "⚠️ Sentry GitHub App evidence not found (non-strict mode)."
          fi

      - name: Check recent Sentry Release workflow health
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_json=$(gh run list --workflow "Sentry Release" --limit 1 --json conclusion,status,url,displayTitle)
          echo "$run_json"

          release_status=$(python3 -c "import json,sys; payload=json.loads(sys.argv[1]); print('missing' if not payload else (payload[0].get('conclusion') or payload[0].get('status') or 'unknown'))" "$run_json")

          echo "release_status=$release_status" >> "$GITHUB_OUTPUT"

      # Measures what the CSP report-uri/report-to channel actually costs. That
      # channel bypasses the Sentry SDK entirely, so the SDK's sampling and its
      # ignorePatterns (which explicitly drop CSP + extension noise) never apply
      # to it. Runs here because this job already holds the Sentry secrets — no
      # token needs to travel anywhere else.
      #
      # Reporting, not gating: it writes to the job summary and does not fail the
      # healthcheck on volume. It DOES fail on a missing secret or a dead API,
      # because "could not measure" must not render as "nothing was wrong".
      #
      # Continue the CSP diagnostic when project access was established.
      # Dedicated access failures still fail the healthcheck.
      - name: Report CSP report-channel volume
        if: always() && steps.token.outputs.token_ok == 'true'
        env:
          SENTRY_MONITOR_MODE: ${{ vars.SENTRY_MONITOR_MODE || 'shared' }}
          SENTRY_AUTH_TOKEN: ${{ (vars.SENTRY_MONITOR_MODE == '' || vars.SENTRY_MONITOR_MODE == 'shared') && secrets.SENTRY_AUTH_TOKEN || '' }}
          SENTRY_MONITOR_AUTH_TOKEN: ${{ vars.SENTRY_MONITOR_MODE == 'dedicated' && secrets.SENTRY_MONITOR_AUTH_TOKEN || '' }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          STATS_PERIOD: "30d"
        run: |
          set -o pipefail
          python3 scripts/sentry_csp_volume.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Sentry Healthcheck"
            echo "- Token/Project API: ${{ steps.token.outputs.token_ok || 'false' }}"
            echo "- Issues API accessible: ${{ steps.token.outputs.issues_ok || 'false' }}"
            echo "- Unresolved issues (sample API): ${{ steps.token.outputs.unresolved_count || 'unknown' }}"
            echo "- Sentry GitHub App evidence detected: ${{ steps.app.outputs.app_detected }}"
            echo "- Recent Sentry Release workflow status: ${{ steps.release.outputs.release_status }}"
          } >> "$GITHUB_STEP_SUMMARY"
