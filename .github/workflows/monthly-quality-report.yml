name: Monthly Post Quality Report

on:
  schedule:
    - cron: '0 0 1 * *'  # 1st of every month, 00:00 UTC (09:00 KST)
  workflow_dispatch:
    inputs:
      create_issue:
        description: 'Create GitHub issue with report'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install frontmatter beautifulsoup4 Pillow

      # `id:` added 2026-08-11. These two steps wrote image_issues/post_issues to
      # $GITHUB_OUTPUT from steps that declared NO id, so the values were
      # unreferenceable — and nothing referenced them anyway (only
      # steps.report.outputs.report_generated was read). Two full-corpus scans ran
      # every month and their results were discarded. The report body comes from
      # generate_quality_report.py, which covers post SCORES and trend coverage but
      # not image verification or check_posts warnings, so the information was
      # genuinely missing rather than duplicated. Now wired into the issue body.
      #
      # `|| true` on the scan is kept — a scan finding problems is the normal case and
      # must not fail this reporting job — but the exit status is captured, because
      # reporting "0 issues" from a scan that CRASHED is a lie, not a clean result.
      - name: Verify images
        id: images
        run: |
          echo "🖼️ Running image verification..."
          set +e
          python3 scripts/verify_images_unified.py --all 2>&1 | tee /tmp/image-report.txt
          SCAN_RC=${PIPESTATUS[0]}
          set -e
          # grep -c emits "0" + exit 1 on no-match, so a `|| echo 0` chain
          # writes two lines and breaks GITHUB_OUTPUT parsing. Use `|| true`.
          IMAGE_ISSUES=$(grep -c '❌\|⚠️' /tmp/image-report.txt 2>/dev/null || true)
          if [ "$SCAN_RC" -gt 1 ]; then
            echo "::warning::verify_images_unified.py exited $SCAN_RC — the issue count below is unreliable."
            echo "image_issues=unknown (scan exited $SCAN_RC)" >> "$GITHUB_OUTPUT"
          else
            echo "image_issues=${IMAGE_ISSUES:-0}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check posts
        id: posts
        run: |
          echo "📝 Running post quality check..."
          set +e
          python3 scripts/check_posts.py 2>&1 | tee /tmp/post-report.txt
          SCAN_RC=${PIPESTATUS[0]}
          set -e
          POST_ISSUES=$(grep -c '⚠️' /tmp/post-report.txt 2>/dev/null || true)
          if [ "$SCAN_RC" -gt 1 ]; then
            echo "::warning::check_posts.py exited $SCAN_RC — the warning count below is unreliable."
            echo "post_issues=unknown (scan exited $SCAN_RC)" >> "$GITHUB_OUTPUT"
          else
            echo "post_issues=${POST_ISSUES:-0}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate quality report and issue body
        id: report
        run: |
          echo "Generating monthly quality report..."
          python3 scripts/generate_quality_report.py
          echo "report_generated=true" >> $GITHUB_OUTPUT

      - name: Create or update issue
        id: issue
        if: |
          steps.report.outputs.report_generated == 'true' &&
          (github.event_name == 'schedule' || github.event.inputs.create_issue == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IMAGE_ISSUES: ${{ steps.images.outputs.image_issues }}
          POST_ISSUES: ${{ steps.posts.outputs.post_issues }}
        run: |
          # Surface the two scans that used to compute counts nobody could read.
          # generate_quality_report.py covers post scores and trend coverage; these
          # two lines are the image-verification and check_posts signals it lacks.
          {
            echo ""
            echo "### 코퍼스 스캔"
            echo ""
            echo "- 이미지 검증 이슈: ${IMAGE_ISSUES:-unknown}"
            echo "- 포스트 경고: ${POST_ISSUES:-unknown}"
          } >> /tmp/quality-report.md

          # Append run URL to report
          echo "" >> /tmp/quality-report.md
          echo "---" >> /tmp/quality-report.md
          echo "*Auto-generated by [Monthly Quality Report](${RUN_URL})*" >> /tmp/quality-report.md

          CURRENT_MONTH=$(date +%Y-%m)
          TITLE="월간 포스트 품질 리포트 - ${CURRENT_MONTH}"

          # Close previous monthly report issues
          OLD_ISSUES=$(gh issue list --label "quality-report" --state open --json number --jq '.[].number' 2>/dev/null || true)
          for ISSUE_NUM in $OLD_ISSUES; do
            gh issue close "$ISSUE_NUM" --comment "새로운 월간 리포트로 대체됩니다." 2>/dev/null || true
          done

          # Create labels if they don't exist
          gh label create "quality-report" --color "0E8A16" --description "Automated quality report" 2>/dev/null || true
          gh label create "automated" --color "EDEDED" --description "Auto-generated by CI" 2>/dev/null || true

          # Create new issue
          # No `|| true`: this issue IS the workflow's deliverable. Actions can create
          # issues in this repo (verified 2026-08-10 — the security-audit reconcile
          # step does it), so a failure here is a real anomaly, and swallowing it means
          # the monthly report silently never existed while the job reported success.
          # Contrast the `|| true` calls above, which are kept deliberately:
          #   - `gh issue list` / `gh issue close`: an empty list and an
          #     already-closed issue are both normal, not errors.
          #   - `gh label create` x2: idempotent create, fails when the label exists.
          #   - `grep -c`: exits 1 when the count is 0, which is a valid count.
          gh issue create \
            --title "$TITLE" \
            --body-file /tmp/quality-report.md \
            --label "quality-report,automated"

          echo "Monthly quality report issue created"

      # This step used to pass a hardcoded --status "SUCCESS" and the literal claim
      # "published to GitHub Issues", under `if: always()`. Neither was derived from
      # whether `gh issue create` actually ran, and `always()` defeats the default
      # skip-on-failure — so a failed issue creation still announced success, and a
      # manual dispatch with create_issue=false announced a publication that never
      # happened. Same bug class as the "Zero-Regression Gate: 100% Passed" literal
      # removed on 2026-08-24. The status now comes from steps.issue.outcome, which
      # is why the step above carries `id: issue`.
      #
      # `outcome` is 'skipped' when the create-issue condition was false, so the
      # three states stay distinguishable: SUCCESS published, FAILED did not, and
      # SKIPPED was not asked to.
      - name: Send Webhook Notification
        if: always() && steps.report.outputs.report_generated == 'true'
        env:
          # Bot API, not an incoming webhook. SLACK_WEBHOOK_URL and
          # DISCORD_WEBHOOK_URL have never been registered in this repo
          # (`gh secret list`, 2026-08-24), so this step delivered nothing from
          # the day it was added. SLACK_BOT_TOKEN and SLACK_CHANNEL_ID ARE
          # configured and slack-post-notify.yml already uses them — the same
          # move PR #583 made for monitoring.yml rather than asking for a new
          # credential.
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          ISSUE_OUTCOME: ${{ steps.issue.outcome }}
          IMAGE_ISSUES: ${{ steps.images.outputs.image_issues || 0 }}
          POST_ISSUES: ${{ steps.posts.outputs.post_issues || 0 }}
        run: |
          CURRENT_MONTH=$(date +%Y-%m)
          case "${ISSUE_OUTCOME}" in
            success)
              STATUS="SUCCESS"
              HEADLINE="Report generated and published to GitHub Issues."
              ;;
            skipped)
              STATUS="WARNING"
              HEADLINE="Report generated. Issue creation was skipped (create_issue=false)."
              ;;
            *)
              STATUS="FAILED"
              HEADLINE="Report generated but issue creation FAILED (outcome: ${ISSUE_OUTCOME:-unknown}). The monthly report does not exist on GitHub Issues."
              ;;
          esac
          # --require-delivery: fail rather than skip. The bot secrets are
          # configured, so their absence means a removal or lost secret access,
          # and silently skipping would hide exactly the regression worth
          # knowing about — notifications quietly stopping, which is what
          # happened here for a month.
          python3 scripts/notify_webhook.py \
            --title "Monthly Blog Quality Report (${CURRENT_MONTH})" \
            --message "• ${HEADLINE}\n• Image Issues: ${IMAGE_ISSUES}\n• Post Warnings: ${POST_ISSUES}" \
            --status "${STATUS}" \
            --require-delivery
