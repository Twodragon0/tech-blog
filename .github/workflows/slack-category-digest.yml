name: Slack Category Digest

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  post-category-digest:
    if: github.event_name != 'schedule' || vars.SLACK_CATEGORY_DIGEST_SCHEDULE != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Build digest message
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          message=$(python scripts/post_category_slack_digest.py \
            --window-hours 24 \
            --channel-alias "security" \
            --site-url "https://tech.2twodragon.com" || true)
          if [ -z "$message" ]; then
            echo "has_message=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_message=true" >> "$GITHUB_OUTPUT"
          {
            echo "message<<EOF"
            echo "$message"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post to Slack via Bot API
        if: steps.digest.outputs.has_message == 'true'
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          MESSAGE: ${{ steps.digest.outputs.message }}
        run: |
          set -euo pipefail
          # Fail, do not skip. SLACK_BOT_TOKEN and SLACK_CHANNEL_ID ARE configured in
          # this repo (verified 2026-08-10 via `gh secret list`), so their absence is not
          # an optional-integration case — it means the secret was removed, rotated
          # without updating, or the job lost access. Skipping green would silence exactly
          # the regression worth knowing about: notifications quietly stopping.
          #
          # This is safe to make hard precisely because the secrets exist. Contrast
          # gsc-queue-refresh.yml and vercel-firewall-backup.yml, whose secrets have
          # never been configured — fail-closed there would only produce a permanently
          # red cron that gets muted. Follows sentry-healthcheck.yml, which already
          # fails on missing secrets.
          if [ -z "${SLACK_BOT_TOKEN:-}" ]; then
            echo "::error::SLACK_BOT_TOKEN is not available. It is configured in this repo, so this is a regression — check secret access for this workflow, not an optional integration."
            exit 1
          fi
          if [ -z "${SLACK_CHANNEL_ID:-}" ]; then
            echo "::error::SLACK_CHANNEL_ID is not available. It is configured in this repo, so this is a regression."
            exit 1
          fi
          payload=$(python3 -c '
          import json, os
          message = os.environ.get("MESSAGE", "")
          channel = os.environ.get("SLACK_CHANNEL_ID", "")
          print(json.dumps({
              "channel": channel,
              "text": message,
              "unfurl_links": False,
              "unfurl_media": False
          }, ensure_ascii=False))
          ')
          HTTP_STATUS=$(curl -sS -o /tmp/slack_resp.txt -w "%{http_code}" \
            "https://slack.com/api/chat.postMessage" \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload")
          echo "Slack response: $HTTP_STATUS"
          # A failed delivery exits non-zero. Until 2026-08-26 both branches below
          # warned and returned 0, so `channel_not_found`, `not_in_channel`,
          # `invalid_auth`, a revoked scope or a 429 produced a GREEN scheduled
          # run with nothing delivered. This workflow fires on a 01:30 UTC timer
          # and nobody reads its logs, so "green" was the only signal available
          # and it was wrong.
          #
          # All three Slack senders in this repo carried the identical block —
          # it was copy-pasted — and all three were fixed together. The guard
          # scripts/tests/test_ci_slack_notify_delivery_guard.py now asserts the
          # shape across the whole family so a fourth copy cannot reintroduce it.
          #
          # Not retried: chat.postMessage is not idempotent and a retry after a
          # lost response double-posts.
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            ok=$(python3 -c 'import json; r=json.load(open("/tmp/slack_resp.txt")); print(r.get("ok",""))')
            if [ "$ok" = "True" ]; then
              echo "Slack digest sent successfully"
            else
              error=$(python3 -c 'import json; r=json.load(open("/tmp/slack_resp.txt")); print(r.get("error","unknown"))')
              echo "::error::Slack accepted the request (HTTP $HTTP_STATUS) but reported ok=false: $error. The category digest was NOT delivered."
              exit 1
            fi
          else
            echo "::error::Slack HTTP error (HTTP $HTTP_STATUS). The category digest was NOT delivered."
            cat /tmp/slack_resp.txt || true
            exit 1
          fi
