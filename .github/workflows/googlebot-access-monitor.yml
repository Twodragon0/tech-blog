name: Googlebot Access Monitor

# Daily probe of the production site as Googlebot. Alerts via Slack when
# Vercel Attack Challenge Mode (or any other crawler-blocking config) is
# detected, since that silently kills GSC indexing.
#
# Background: 2026-05-04 incident — Attack Challenge Mode was re-enabled
# in the Vercel dashboard, blocking Googlebot with HTTP 429 + challenge
# header on every URL including sitemap.xml. GSC reported 0 impressions
# until the mode was disabled. See
# docs/troubleshooting/VERCEL_SECURITY_CHECKPOINT_FIX.md.

on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC = 11:00 KST daily
  workflow_dispatch:

concurrency:
  group: googlebot-access-monitor
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 1

      - name: Probe production site as Googlebot
        id: probe
        shell: bash
        run: |
          set +e
          bash scripts/check_googlebot_access.sh "https://tech.2twodragon.com" \
            > /tmp/probe.txt 2>&1
          status=$?
          set -e
          {
            echo 'output<<PROBE_EOF'
            cat /tmp/probe.txt
            echo 'PROBE_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/probe.txt
          exit $status

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          PROBE_OUTPUT: ${{ steps.probe.outputs.output }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          # Fail, do not skip. SLACK_BOT_TOKEN and SLACK_CHANNEL_ID ARE configured in
          # this repo (verified 2026-08-10 via `gh secret list`), so their absence is not
          # an optional-integration case — it means the secret was removed, rotated
          # without updating, or the job lost access. Skipping green would silence exactly
          # the regression worth knowing about: notifications quietly stopping.
          #
          # This is safe to make hard precisely because the secrets exist. Contrast
          # gsc-queue-refresh.yml and vercel-firewall-backup.yml, whose secrets have
          # never been configured — fail-closed there would only produce a permanently
          # red cron that gets muted. Follows sentry-healthcheck.yml, which already
          # fails on missing secrets.
          if [ -z "${SLACK_BOT_TOKEN:-}" ] || [ -z "${SLACK_CHANNEL_ID:-}" ]; then
            echo "::error::SLACK_BOT_TOKEN or SLACK_CHANNEL_ID is not available. Both are configured in this repo, so the alert this job exists to deliver would have been dropped silently."
            exit 1
          fi
          payload=$(python3 -c '
          import json, os
          probe = os.environ.get("PROBE_OUTPUT", "(no output)")
          run_url = os.environ.get("RUN_URL", "")
          channel = os.environ.get("SLACK_CHANNEL_ID", "")
          message = (
              ":rotating_light: *Googlebot access probe failed*\n"
              "tech.2twodragon.com is returning HTTP 429 / challenge to "
              "Googlebot. Likely cause: Vercel Attack Challenge Mode is "
              "enabled — disable at "
              "https://vercel.com/twodragon0s-projects/tech-blog/settings/security\n"
              f"Run: {run_url}\n"
              f"```\n{probe[-1500:]}\n```"
          )
          print(json.dumps({
              "channel": channel,
              "text": message,
              "unfurl_links": False,
              "unfurl_media": False,
          }, ensure_ascii=False))
          ')
          HTTP_STATUS=$(curl -sS -o /tmp/slack_resp.txt -w "%{http_code}" \
            "https://slack.com/api/chat.postMessage" \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload")
          echo "Slack response: $HTTP_STATUS"
          # A failed delivery exits non-zero. The step above already refuses to
          # run with a missing secret on exactly this reasoning — "the alert this
          # job exists to deliver would have been dropped silently" — but the
          # delivery itself then warned and returned 0, dropping the alert
          # silently for every other reason: channel_not_found, not_in_channel,
          # invalid_auth, a revoked scope, HTTP 429. Half the argument was
          # implemented.
          #
          # This one is a Googlebot-visibility alarm, so a dropped alert means
          # the site can be serving 429 to Googlebot with nobody told — the
          # failure mode that first made this workflow necessary.
          #
          # Not retried: chat.postMessage is not idempotent and a retry after a
          # lost response double-posts.
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            ok=$(python3 -c 'import json; r=json.load(open("/tmp/slack_resp.txt")); print(r.get("ok",""))')
            if [ "$ok" = "True" ]; then
              echo "Slack notification sent successfully"
            else
              error=$(python3 -c 'import json; r=json.load(open("/tmp/slack_resp.txt")); print(r.get("error","unknown"))')
              echo "::error::Slack accepted the request (HTTP $HTTP_STATUS) but reported ok=false: $error. The Googlebot probe failure above was NOT announced."
              exit 1
            fi
          else
            echo "::error::Slack HTTP error (HTTP $HTTP_STATUS). The Googlebot probe failure above was NOT announced."
            cat /tmp/slack_resp.txt || true
            exit 1
          fi
