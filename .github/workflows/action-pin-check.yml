name: Action Pin Check

# Workflow hygiene. Two checks, same trigger:
#
# 1. All GitHub Actions `uses:` references across .github/workflows/ use
#    consistent 40-char SHA pins. Floating tags (@v1, @v2) generate warnings.
#    On PRs that touch workflow files, existence is verified via the GitHub API.
# 2. actionlint over every workflow (added 2026-08-26). Until then NOTHING
#    linted these files — no CI job and no pre-commit hook ran actionlint or
#    shellcheck over them, which is a gap worth closing after a session that
#    edited seven of them.
# 3. A ratchet over the informational tiers actionlint reports but the gate in
#    (2) deliberately excludes (added 2026-08-27). Excluding a tier and printing
#    its count is honest; it is not a control. Nothing stopped the 70 findings
#    measured on 2026-08-26 from becoming 90. Steps (2) and (3) are exact
#    complements, so every finding actionlint emits is covered by one of them.
#
# Why it lands here rather than in a new workflow: identical purpose and
# identical trigger (`.github/workflows/**` on PR + main push).

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      # The ratchet baseline and its checker are triggers too. Without this a
      # PR could raise the baseline on its own (no workflow touched, job never
      # runs, merges green) and a second PR would then land the extra findings
      # against the already-widened number.
      - 'scripts/check_actionlint_ratchet.py'
      - 'scripts/actionlint_ratchet_baseline.txt'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'scripts/check_actionlint_ratchet.py'
      - 'scripts/actionlint_ratchet_baseline.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-pins:
    name: Validate action pin consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: '3.12'

      - name: Check action pin consistency (with SHA existence verification)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/check_workflow_action_pins.py --check-existence

      - name: Install shellcheck (version-pinned, checksum-verified)
        env:
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          set -euo pipefail
          # actionlint shells out to whatever is on PATH, so the runner's
          # preinstalled version decides both which findings appear AND at what
          # severity. That version is not ours: ubuntu-24.04 ships 0.9.0 and
          # ubuntu-22.04 ships 0.8.0, while the ratchet baseline below is
          # generated by a developer running 0.11.0. An unpinned analyzer plus a
          # committed count is a job born red — the same class of defect as
          # capturing visual baselines on one runner and verifying on another.
          #
          # Installed into /usr/local/bin so it precedes /usr/bin on PATH.
          #
          # Verified locally 2026-08-27: this URL and checksum match the real
          # artifact (2.6 MB, statically linked ELF x86-64).
          cd "$RUNNER_TEMP"
          curl -sSL --retry 3 --max-time 180 -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar xJf shellcheck.tar.xz "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          sudo install -m 0755 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          command -v shellcheck
          shellcheck --version

      - name: Install actionlint (version-pinned, checksum-verified)
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          # Not the upstream `download-actionlint.bash` one-liner: that curls a
          # script from the mutable `main` ref and pipes it to bash, which is
          # the opposite of what this workflow exists to enforce. Not a `uses:`
          # action either — that would add a pin for check_workflow_action_pins
          # to track for a single binary fetch. Release tarball + checksum keeps
          # the supply chain auditable in-file.
          #
          # Verified locally 2026-08-26: this URL and checksum match the real
          # artifact (2353908 bytes, statically linked ELF x86-64).
          cd "$RUNNER_TEMP"
          curl -sSL --retry 3 --max-time 120 -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: actionlint (blocking — warning and above)
        run: |
          set -euo pipefail
          # NOTE: no comment line in this script may begin with the word
          # "shellcheck" straight after the `#` — shellcheck parses that as a
          # directive and reports SC1072/SC1073. This gate caught exactly that
          # in its own first draft, before merge.
          #
          # Threshold: actionlint's own rules (all severities) plus SC findings
          # at `warning` and above. Measured on the corpus 2026-08-26,
          # before wiring — the rule this repo learned the hard way is to run a
          # dormant gate at the scope you intend to enforce and read the output
          # first, because a gate nobody has run has never been right:
          #
          #   actionlint native rules ... 0 findings
          #   SC info .................. 65  (59x SC2086 quote-to-prevent-splitting)
          #   SC style .................. 5  (SC2129 prefer `{ } >> file`)
          #   SC warning ................ 1  (SC2034 unused var in sentry-release)
          #
          # The one warning is fixed in this change, so this step starts at zero
          # rather than being born red. info+style are excluded deliberately:
          # 70 cosmetic findings across 12 workflows would either force an
          # unrelated 70-site rewrite or get muted, and muted gates are how this
          # repo ended up with jobs that had never once been right. They are
          # surfaced in the summary step below instead of hidden.
          #
          # The ignore patterns are anchored to `SC<digits>:` so they can only
          # ever suppress SC output — a bare ':info:' could match a
          # native actionlint message and silently widen the hole.
          actionlint \
            -ignore 'SC[0-9]+:info:' \
            -ignore 'SC[0-9]+:style:'

      # Name deliberately avoids the substring "actionlint informational": the
      # guard test resolves steps by name fragment, and a second step matching
      # that fragment made it assert against the wrong step.
      - name: actionlint info/style ratchet (blocking — the count may not grow)
        run: |
          set -euo pipefail
          # The complement of the gate above. Compares the info/style findings
          # against scripts/actionlint_ratchet_baseline.txt, keyed on
          # (file, SC-code, severity) rather than the message text — the text
          # embeds line:col positions, so an unrelated edit above a finding
          # would otherwise read as "one vanished, one new". Measured; see the
          # module docstring.
          #
          # Two-sided on purpose: fewer findings than the baseline also fails,
          # with a --update instruction. A ratchet that never tightens is a
          # ceiling, and it leaves the freed slots open to be refilled.
          python3 scripts/check_actionlint_ratchet.py

      - name: actionlint informational findings (non-blocking)
        if: always()
        run: |
          set -uo pipefail
          # Visibility for the excluded tiers, so "we ignore info" does not
          # decay into "nobody knows how many there are". Counts are derived
          # from the actual run, never asserted as a constant.
          out="$(actionlint 2>&1 || true)"
          info=$(printf '%s\n' "$out" | grep -cE 'SC[0-9]+:info:' || true)
          style=$(printf '%s\n' "$out" | grep -cE 'SC[0-9]+:style:' || true)
          {
            echo "## actionlint — informational (not gating)"
            echo ""
            echo "- SC \`info\`: ${info}"
            echo "- SC \`style\`: ${style}"
            echo ""
            echo "Gating tier is \`warning\` and above, plus all native actionlint rules."
            echo "These two tiers are not gated on an absolute number, but they are"
            echo "ratcheted: see \`scripts/actionlint_ratchet_baseline.txt\`. The count"
            echo "may fall, never rise."
          } >> "$GITHUB_STEP_SUMMARY"
