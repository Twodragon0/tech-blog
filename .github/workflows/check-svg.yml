name: SVG Quality Check

# Trigger scope must cover everything this workflow's steps depend on, because
# the steps scan the WHOLE corpus (check_svg_quality.py over assets/images/), not
# just the changed files. When the trigger is narrower than the scan, a regression
# stays hidden until some unrelated change happens to touch a filtered path — and
# that PR then inherits a failure it did not cause.
#
# Observed 2026-07-13 → 08-04: commit 6bbe71af restored 4 README architecture SVGs
# without <title>, main went red, and because no filtered path changed for three
# weeks the workflow never ran. PR #481 (touching scripts/check_posts.py) tripped
# the trigger and inherited the 4 pre-existing FAILs. Fixed in #489.
#
# Two-part fix: (1) the daily `schedule:` scans main regardless of paths, so a
# corpus regression surfaces within 24h; (2) `paths` lists every script the steps
# invoke plus this workflow file, so editing the gate runs the gate.
#
# 2026-08-10 follow-up: the SVG glob was `assets/images/*.svg`, which in Actions
# path filters does not cross `/`. verify_images_unified.py:267 scans with
# `IMAGES_DIR.rglob("*.svg")` — measured 307 SVGs at depth 1 and 156 at depth >= 2
# (diagrams/, mermaid/, _unused_archive/). Those 156 were inside the scan and
# outside the trigger: the same trigger-narrower-than-scan shape described above,
# one directory level down. Widened to `**.svg`, matching svg-lint.yml's glob.
on:
  push:
    branches:
      - main
    paths:
      - 'assets/images/**.svg'
      - 'scripts/check_posts.py'
      - 'scripts/check_cover_qr_urls.py'
      - 'scripts/check_svg_quality.py'
      - 'scripts/verify_images_unified.py'
      - '.github/workflows/check-svg.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'assets/images/**.svg'
      - 'scripts/check_posts.py'
      - 'scripts/check_cover_qr_urls.py'
      - 'scripts/check_svg_quality.py'
      - 'scripts/verify_images_unified.py'
      - '.github/workflows/check-svg.yml'
  schedule:
    # 03:15 UTC = 12:15 KST. Free slot: the blogwatcher digest (00:00), the Pages
    # backup deploy (00:30), monitoring (01:00), translate-backfill (01:30),
    # googlebot monitor (02:00) and the Sentry healthcheck (02:30) have all
    # settled, and the ops-orchestrator lanes (*/6h, 04:00) do not collide.
    - cron: '15 3 * * *'
  workflow_dispatch: {}

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-svg:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y libxml2-utils
          pip install -q pyyaml frontmatter qrcode 2>/dev/null || true

      - name: Validate SVG XML well-formedness
        run: |
          echo "Validating SVG XML well-formedness via xmllint..."
          python3 scripts/verify_images_unified.py --svg-validate

      # No --fix here, deliberately. Until 2026-08-10 this step ran
      # `--fix --ci`, which repaired missing width/height in the CI workspace and
      # only then asserted. Nothing commits that repair, so every run re-fixed the
      # same files, passed, and the "SVG missing dimensions" regression class could
      # never surface — the gate was reporting on output it had just rewritten.
      # Verified before removing: `--ci` alone gives 307 PASS / 0 WARNING / 0 FAIL
      # on the current corpus, so this is not deferring a backlog.
      # To repair locally: python3 scripts/check_svg_quality.py --fix assets/images/
      - name: Check SVG quality
        run: |
          echo "Checking SVG quality (read-only; use --fix locally to repair)..."
          python3 scripts/check_svg_quality.py --ci assets/images/
          echo "SVG quality check passed"

      - name: Check cover QR URLs match canonical post permalink
        run: |
          echo "Verifying QR codes encode the canonical Jekyll permalink..."
          python3 scripts/check_cover_qr_urls.py
          echo "Cover QR URL check passed"

      # The `|| true` that used to wrap check_posts.py is gone. Detection here rests
      # on grepping two literal strings out of the script's stdout, so a traceback,
      # an import error, or a renamed message produced TOTAL=0 and this step passed
      # under the name "zero SVG warnings" while having verified nothing. The
      # script's own exit code is now the first gate; the grep is the second.
      # Verified before removing: check_posts.py exits 0 on the current corpus.
      - name: Check posts quality (zero SVG warnings)
        run: |
          set -o pipefail
          if ! OUTPUT=$(python3 scripts/check_posts.py 2>&1); then
            echo "$OUTPUT" | tail -30
            echo "::error::check_posts.py exited non-zero. The SVG-warning grep below cannot be trusted when the script itself failed."
            exit 1
          fi
          TRUNCATED=$(echo "$OUTPUT" | grep -c "truncated" || true)
          DENSE=$(echo "$OUTPUT" | grep -c "text too dense" || true)
          TOTAL=$((TRUNCATED + DENSE))
          echo "SVG warnings: truncated=$TRUNCATED, dense=$DENSE, total=$TOTAL"
          if [ "$TOTAL" -gt "0" ]; then
            echo "$OUTPUT" | grep -E "truncated|text too dense"
            echo "::error::check_posts.py reported $TOTAL SVG warnings. Fix before merging."
            exit 1
          fi
