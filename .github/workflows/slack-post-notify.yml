name: Slack Post Notification

# 새 포스트가 push되면 Slack으로 알림 전송
# Slack Bot API (chat.postMessage) 사용

on:
  push:
    branches: [main]
    paths:
      - '_posts/**'
  # Called by ai-blogwatcher.yml after it pushes a digest to main. The `push`
  # trigger above cannot fire for that commit: the bot pushes with GITHUB_TOKEN
  # and GitHub suppresses workflow runs from it (recursion prevention), so cron
  # digests were never announced. The caller passes the exact post path and the
  # exact commit, which also removes this workflow's `HEAD~1 HEAD` assumption.
  workflow_call:
    inputs:
      post_path:
        description: 'Single post path to announce. When set, skips git-diff detection.'
        required: false
        type: string
      ref:
        description: 'Commit to check out. Required with post_path — the caller ran on an older SHA.'
        required: false
        type: string

concurrency:
  # `github.ref` is the CALLER's ref on a workflow_call, which for the nightly
  # cron is the same `refs/heads/main` as a human push. Without the post path in
  # the key, a human merge landing while the cron announces would cancel the
  # cron's announcement (cancel-in-progress). Keying on the payload keeps the
  # original push-side coalescing while letting the two run side by side.
  group: slack-post-notify-${{ github.ref }}-${{ inputs.post_path || 'push' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: "https://tech.2twodragon.com"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          # On a workflow_call the default ref is the CALLER's triggering SHA —
          # for the nightly cron that is main as it stood before the digest was
          # pushed, i.e. a checkout without the post we are announcing. The
          # caller passes the post-push SHA; empty falls back to the default,
          # which is what the `push` trigger wants.
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Detect new posts and build message
        id: posts
        shell: bash
        env:
          # Via env, never inlined into the run body: a caller-supplied path must
          # reach the shell as a literal string, not as text the shell re-parses.
          # Same rule buttondown-notify.yml adopted for its dispatch input.
          POST_PATH: ${{ inputs.post_path }}
        run: |
          set -euo pipefail
          if [ -n "${POST_PATH:-}" ]; then
            # Caller-supplied path. Do not fall back to git-diff detection if it
            # is missing: that would silently announce whatever the diff happens
            # to contain instead of the post we were asked to announce.
            if [ ! -f "$POST_PATH" ]; then
              echo "::error::post_path '$POST_PATH' does not exist at the checked-out ref. Was the correct 'ref' input passed?"
              exit 1
            fi
            NEW_POSTS="$POST_PATH"
          else
            NEW_POSTS=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- '_posts/*.md' 2>/dev/null || echo "")
          fi
          if [ -z "$NEW_POSTS" ]; then
            echo "No new posts detected"
            echo "has_posts=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_posts=true" >> "$GITHUB_OUTPUT"
          POST_COUNT=$(echo "$NEW_POSTS" | grep -c '^' || true)
          echo "count=${POST_COUNT:-0}" >> "$GITHUB_OUTPUT"
          python3 scripts/build_slack_post_message.py "$NEW_POSTS" >> "$GITHUB_OUTPUT"

      - name: Post to Slack via Bot API
        if: steps.posts.outputs.has_posts == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          MESSAGE: ${{ steps.posts.outputs.message }}
        shell: bash
        run: |
          set -euo pipefail
          # Fail, do not skip. SLACK_BOT_TOKEN and SLACK_CHANNEL_ID ARE configured in
          # this repo (verified 2026-08-10 via `gh secret list`), so their absence is not
          # an optional-integration case — it means the secret was removed, rotated
          # without updating, or the job lost access. Skipping green would silence exactly
          # the regression worth knowing about: notifications quietly stopping.
          #
          # This is safe to make hard precisely because the secrets exist. Contrast
          # gsc-queue-refresh.yml and vercel-firewall-backup.yml, whose secrets have
          # never been configured — fail-closed there would only produce a permanently
          # red cron that gets muted. Follows sentry-healthcheck.yml, which already
          # fails on missing secrets.
          if [ -z "${SLACK_BOT_TOKEN:-}" ]; then
            echo "::error::SLACK_BOT_TOKEN is not available. It is configured in this repo, so this is a regression — check secret access for this workflow, not an optional integration."
            exit 1
          fi
          if [ -z "${SLACK_CHANNEL_ID:-}" ]; then
            echo "::error::SLACK_CHANNEL_ID is not available. It is configured in this repo, so this is a regression."
            exit 1
          fi
          payload=$(python3 -c '
          import json, os
          message = os.environ.get("MESSAGE", "")
          channel = os.environ.get("SLACK_CHANNEL_ID", "")
          print(json.dumps({
              "channel": channel,
              "text": message,
              "unfurl_links": False,
              "unfurl_media": False
          }, ensure_ascii=False))
          ')
          HTTP_STATUS=$(curl -sS -o /tmp/slack_resp.txt -w "%{http_code}" \
            "https://slack.com/api/chat.postMessage" \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload")
          echo "Slack response: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            ok=$(python3 -c 'import json; r=json.load(open("/tmp/slack_resp.txt")); print(r.get("ok",""))')
            if [ "$ok" = "True" ]; then
              echo "Slack notification sent successfully"
            else
              error=$(python3 -c 'import json; r=json.load(open("/tmp/slack_resp.txt")); print(r.get("error","unknown"))')
              echo "::warning::Slack API error: $error"
            fi
          else
            echo "::warning::Slack HTTP error (HTTP $HTTP_STATUS)"
            cat /tmp/slack_resp.txt || true
          fi
