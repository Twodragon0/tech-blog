name: Production Monitoring

on:
  schedule:
    # 매일 오전 10시 KST = UTC 01:00
    # GitHub Actions cron은 큐 지연이 있을 수 있음 (최대 15-30분)
    - cron: '0 1 * * *'
  # Also allow manual trigger
  workflow_dispatch:

permissions:
  issues: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Check site availability
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 -A "Mozilla/5.0 TechBlogMonitor" https://tech.2twodragon.com)
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 429 ]; then
            echo "::warning::Site returned HTTP 429 (rate limited) - site is alive"
          elif [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 400 ]; then
            echo "::error::Site returned HTTP $HTTP_STATUS"
            exit 1
          else
            echo "Site is accessible (HTTP $HTTP_STATUS)"
          fi

      - name: Check Vercel CLI
        if: env.HAS_VERCEL_TOKEN == 'true'
        run: |
          npm list -g vercel > /dev/null 2>&1 || npm i -g vercel

      - name: Check jq
        run: |
          which jq > /dev/null 2>&1 || (apt-get update && apt-get install -y jq)

      - name: Run Vercel monitoring
        run: bash scripts/monitor_vercel_builds.sh https://tech.2twodragon.com --alert-only
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const body = [
              '## Production Monitoring Failed',
              '',
              '**Time**: ' + new Date().toISOString(),
              '',
              '**Workflow Run**: [View Run](' + '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' + ')',
              '',
              '**Details**:',
              '- Check the workflow run logs for detailed error information',
              '- This usually indicates deployment issues, performance degradation, or API connectivity problems',
              '',
              '## Action Items',
              '- [ ] Review deployment logs',
              '- [ ] Check Vercel dashboard',
              '- [ ] Verify Sentry configuration',
              '- [ ] Check API key expiration',
              '',
              '---',
              '*Automated monitoring alert*'
            ].join('\n');
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Production Monitoring Alert - ' + new Date().toISOString().split('T')[0],
              body: body,
              labels: ['monitoring', 'alert', 'production']
            })

      # Was `slackapi/slack-github-action` with `webhook: secrets.SLACK_WEBHOOK`,
      # gated on `env.HAS_SLACK_WEBHOOK == 'true'`. SLACK_WEBHOOK has never been
      # configured in this repo (`gh secret list`, 2026-08-21), so that condition
      # was always false and this alert channel had never fired once — the same
      # shape as vercel-firewall-backup reporting success while never taking a
      # snapshot. SLACK_BOT_TOKEN and SLACK_CHANNEL_ID *are* configured and are
      # what slack-post-notify.yml / slack-category-digest.yml already use, so
      # this switches to the credential that exists rather than asking for a new
      # one. Fail-closed for the same reason as those two: the step only runs
      # after monitoring already failed, so a missing secret here means the alert
      # about a real outage is being dropped.
      # Pinned by scripts/tests/test_ci_secret_absence_guard.py (FAIL_CLOSED).
      - name: Slack notification on failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SLACK_BOT_TOKEN:-}" ]; then
            echo "::error::SLACK_BOT_TOKEN is not available. It is configured in this repo, so this is a regression — a production monitoring failure is going unannounced."
            exit 1
          fi
          if [ -z "${SLACK_CHANNEL_ID:-}" ]; then
            echo "::error::SLACK_CHANNEL_ID is not available. It is configured in this repo, so this is a regression."
            exit 1
          fi
          payload=$(python3 -c '
          import json, os
          text = (
              "*Production Monitoring Failed*\n"
              f"<{os.environ["RUN_URL"]}|View Workflow Run>\n"
              f"Repository: `{os.environ["REPOSITORY"]}`  Branch: `{os.environ["BRANCH"]}`\n"
              "Site: <https://tech.2twodragon.com|tech.2twodragon.com>"
          )
          print(json.dumps({
              "channel": os.environ["SLACK_CHANNEL_ID"],
              "text": text,
              "unfurl_links": False,
              "unfurl_media": False,
          }, ensure_ascii=False))
          ')
          HTTP_STATUS=$(curl -sS -o /tmp/slack_resp.txt -w "%{http_code}" \
            "https://slack.com/api/chat.postMessage" \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload")
          echo "Slack response: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            ok=$(python3 -c 'import json; r=json.load(open("/tmp/slack_resp.txt")); print(r.get("ok",""))')
            if [ "$ok" = "True" ]; then
              echo "Slack alert sent"
            else
              error=$(python3 -c 'import json; r=json.load(open("/tmp/slack_resp.txt")); print(r.get("error","unknown"))')
              echo "::warning::Slack API error: $error"
            fi
          else
            echo "::warning::Slack HTTP error (HTTP $HTTP_STATUS)"
            cat /tmp/slack_resp.txt || true
          fi

  success-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: monitor
    if: success()
    steps:
      - name: Log successful monitoring
        run: |
          echo "Monitoring completed successfully at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "All production metrics within acceptable range"
