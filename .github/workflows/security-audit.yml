name: Security Audit

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9:00 UTC
  push:
    paths:
      - '.github/workflows/security-audit.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'Gemfile'
      - 'Gemfile.lock'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      should-audit: ${{ steps.set-output.outputs.should-audit }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 2

      - name: Check changed files
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4
        with:
          filters: |
            should-audit:
              - '.github/workflows/security-audit.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'Gemfile'
              - 'Gemfile.lock'

      - name: Set output
        id: set-output
        run: |
          if [ "${{ github.event_name }}" == "schedule" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should-audit=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" == "push" ] || [ "${{ github.event_name }}" == "pull_request" ]; then
            if [ "${{ steps.filter.outputs.should-audit }}" == "true" ]; then
              echo "should-audit=true" >> "$GITHUB_OUTPUT"
            else
              echo "should-audit=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "should-audit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Output decision
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Filter output: ${{ steps.filter.outputs.should-audit }}"
          echo "Should audit: ${{ steps.set-output.outputs.should-audit }}"

  npm-audit:
    name: npm Security Audit
    needs: check-changes
    if: (github.event_name != 'schedule' || vars.SECURITY_AUDIT_SCHEDULE != 'false') && needs.check-changes.outputs.should-audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      verdict: ${{ steps.npm_audit.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        id: npm_audit
        run: |
          set -euo pipefail
          status=0
          npm audit --audit-level=high --json > npm-audit-report.json 2> npm-audit-stderr.txt || status=$?

          if ! jq -e '
            (.error == null) and
            (.metadata.vulnerabilities.high | type == "number" and . >= 0 and floor == .) and
            (.metadata.vulnerabilities.critical | type == "number" and . >= 0 and floor == .)
          ' npm-audit-report.json >/dev/null; then
            echo "::error::npm audit returned invalid or incomplete JSON; no verdict emitted"
            cat npm-audit-stderr.txt >&2
            exit 1
          fi

          VULNS=$(jq -er '.metadata.vulnerabilities.high + .metadata.vulnerabilities.critical' npm-audit-report.json)
          if [ "$status" -eq 0 ] && [ "$VULNS" -eq 0 ]; then
            verdict=clean
          elif [ "$status" -eq 1 ] && [ "$VULNS" -gt 0 ]; then
            verdict=findings
          else
            echo "::error::npm audit exit code ($status) conflicts with parsed high/critical count ($VULNS); no verdict emitted"
            cat npm-audit-stderr.txt >&2
            exit 1
          fi

          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "vulnerabilities=$VULNS" >> "$GITHUB_OUTPUT"
          if [ "$verdict" = findings ]; then
            echo "## npm Audit: $VULNS high/critical vulnerabilities found" >> "$GITHUB_STEP_SUMMARY"
            jq -r '
              (.vulnerabilities // {}) | to_entries[] |
              select(.value.severity == "high" or .value.severity == "critical") |
              "- \(.key): \(.value.severity)"
            ' npm-audit-report.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## npm Audit completed: no high/critical findings reported" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Self-clearing signal. This step used to run only when VULNS > 0 and did
      # nothing when an open "npm audit" issue already existed — and it never closed
      # one. Because the audit step is `|| true`, the issue is the ONLY signal this
      # gate produces, so a stale open issue silenced it completely: measured
      # 2026-08-10, #414 and #415 were still open from 2026-06-15 while `npm audit`
      # reported 0 high/critical, meaning the next real vulnerability would have
      # produced a green job and no notification at all.
      #
      # Now it always runs and reconciles: open/update when findings exist, close
      # when they are gone, and close duplicates. Matching is by a hidden marker
      # rather than the title, so retitling cannot fork the issue — with a one-time
      # title fallback so the legacy #414/#415 get adopted instead of orphaned.
      - name: Reconcile npm audit issue
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          VULNS: ${{ steps.npm_audit.outputs.vulnerabilities }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const MARKER = '<!-- security-audit: npm -->';
            const LEGACY = 'npm audit';
            const raw = (process.env.VULNS || '').trim();
            const count = Number(raw);
            const runUrl = process.env.RUN_URL;

            // An empty or non-numeric VULNS must NOT be read as "0 findings" —
            // Number('') is 0, which would auto-close a live issue on the strength
            // of a missing value. Reconciling on absent evidence is the same class
            // of mistake as the `|| true` this gate is being repaired for.
            if (raw === '' || !Number.isFinite(count)) {
              core.warning(`npm audit produced no usable count (VULNS=${JSON.stringify(raw)}); leaving issue state untouched.`);
              return;
            }

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security',
              per_page: 100,
            });
            const mine = open.filter(
              (i) => (i.body || '').includes(MARKER) || i.title.includes(LEGACY)
            );
            // Two concurrent runs both passed the old !existing check on 2026-06-15
            // and created #414 and #415. Keep the oldest, close the rest.
            mine.sort((a, b) => a.number - b.number);
            const primary = mine[0];
            for (const dup of mine.slice(1)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: dup.number,
                body: `Duplicate of #${primary.number}; closing so the audit has a single signal.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: dup.number, state: 'closed', state_reason: 'not_planned',
              });
            }

            const body = [
              MARKER,
              '',
              `npm audit reports **${count}** high/critical vulnerabilities.`,
              '',
              'Reproduce: `npm audit --audit-level=high`',
              'Fix where possible: `npm audit fix`',
              '',
              `Last updated by ${runUrl}`,
            ].join('\n');

            if (count > 0) {
              if (primary) {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: primary.number,
                  title: `[Security] npm audit: ${count} high/critical vulnerabilities`,
                  body,
                });
                core.info(`updated #${primary.number} (count=${count})`);
              } else {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title: `[Security] npm audit: ${count} high/critical vulnerabilities`,
                  labels: ['security', 'dependencies'],
                  body,
                });
                core.info(`opened #${created.data.number}`);
              }
              return;
            }

            if (primary) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: primary.number,
                body: `npm audit now reports 0 high/critical vulnerabilities — closing. ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: primary.number, state: 'closed', state_reason: 'completed',
              });
              core.info(`closed #${primary.number} (clean)`);
            } else {
              core.info('no findings, no open issue — nothing to do');
            }

  bundle-audit:
    name: Ruby Gem Security Audit
    needs: check-changes
    if: (github.event_name != 'schedule' || vars.SECURITY_AUDIT_SCHEDULE != 'false') && needs.check-changes.outputs.should-audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      verdict: ${{ steps.bundle_audit.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199  # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install bundle-audit
        run: gem install bundler-audit

      - name: Run bundle audit
        id: bundle_audit
        run: |
          set -euo pipefail
          status=0
          bundle audit check --update > bundle-audit-report.txt 2>&1 || status=$?

          if grep -Fq "Vulnerabilities found!" bundle-audit-report.txt && ! grep -Fq "No vulnerabilities found" bundle-audit-report.txt; then
            if [ "$status" -ne 1 ]; then
              echo "::error::bundle audit reported findings with unexpected exit code ($status); no verdict emitted"
              cat bundle-audit-report.txt >&2
              exit 1
            fi
            verdict=findings
            vulnerable=true
          elif grep -Fq "No vulnerabilities found" bundle-audit-report.txt && ! grep -Fq "Vulnerabilities found!" bundle-audit-report.txt; then
            if [ "$status" -ne 0 ]; then
              echo "::error::bundle audit reported clean output with nonzero exit code ($status); no verdict emitted"
              cat bundle-audit-report.txt >&2
              exit 1
            fi
            verdict=clean
            vulnerable=false
          else
            echo "::error::bundle audit output has no unambiguous clean/findings verdict (exit code $status)"
            cat bundle-audit-report.txt >&2
            exit 1
          fi

          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "vulnerable=$vulnerable" >> "$GITHUB_OUTPUT"
          if [ "$vulnerable" = true ]; then
            echo "## Bundle Audit: Vulnerabilities found" >> "$GITHUB_STEP_SUMMARY"
            cat bundle-audit-report.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Bundle Audit completed: no vulnerabilities reported" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Same self-clearing reconcile as the npm side. #446 was still open from
      # 2026-07-10 while `bundle audit check --update` reported "No vulnerabilities
      # found" (verified locally 2026-08-10), so the stale issue was suppressing the
      # only notification this gate can emit.
      - name: Reconcile bundle audit issue
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          VULNERABLE: ${{ steps.bundle_audit.outputs.vulnerable }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const MARKER = '<!-- security-audit: bundle -->';
            const LEGACY = 'bundle-audit';
            const rawVuln = (process.env.VULNERABLE || '').trim();
            const runUrl = process.env.RUN_URL;

            // Same rule as the npm side: only 'true'/'false' are evidence. An empty
            // value means the audit step did not produce a verdict, so nothing is
            // opened and — critically — nothing is closed.
            if (rawVuln !== 'true' && rawVuln !== 'false') {
              core.warning(`bundle audit produced no usable verdict (VULNERABLE=${JSON.stringify(rawVuln)}); leaving issue state untouched.`);
              return;
            }
            const vulnerable = rawVuln === 'true';

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security',
              per_page: 100,
            });
            const mine = open.filter(
              (i) => (i.body || '').includes(MARKER) || i.title.includes(LEGACY)
            );
            mine.sort((a, b) => a.number - b.number);
            const primary = mine[0];
            for (const dup of mine.slice(1)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: dup.number,
                body: `Duplicate of #${primary.number}; closing so the audit has a single signal.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: dup.number, state: 'closed', state_reason: 'not_planned',
              });
            }

            if (vulnerable) {
              const body = [
                MARKER,
                '',
                'bundle-audit detected vulnerabilities in Ruby gems.',
                '',
                'Reproduce: `bundle audit check --update`',
                'Fix: `bundle update [gem_name]`',
                '',
                `Last updated by ${runUrl}`,
              ].join('\n');
              if (primary) {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: primary.number,
                  title: '[Security] bundle-audit: Ruby gem vulnerabilities detected',
                  body,
                });
                core.info(`updated #${primary.number}`);
              } else {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title: '[Security] bundle-audit: Ruby gem vulnerabilities detected',
                  labels: ['security', 'dependencies'],
                  body,
                });
                core.info(`opened #${created.data.number}`);
              }
              return;
            }

            if (primary) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: primary.number,
                body: `bundle-audit now reports no vulnerabilities — closing. ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: primary.number, state: 'closed', state_reason: 'completed',
              });
              core.info(`closed #${primary.number} (clean)`);
            } else {
              core.info('no findings, no open issue — nothing to do');
            }

  summary:
    name: Security Audit Summary
    needs: [check-changes, npm-audit, bundle-audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      # This job used to compare needs.*.result against "failure" only and then
      # print "✅ Security audit clean (or skipped — no dependency changes)".
      # Measured 2026-08-10: across the 30 most recent merged PRs both audit jobs
      # reported `skipped` on 100% of appearances (correct — they are gated on
      # package.json / package-lock.json / Gemfile / Gemfile.lock changing), while
      # this job reported success on all 30. "clean" and "did not run" therefore
      # rendered identically, and any consumer treating this name as coverage was
      # reading a guaranteed green.
      #
      # Skipped stays a pass — failing every PR that does not touch a manifest would
      # be noise, and the Monday cron runs both audits unconditionally (25 schedule
      # runs verified). What changes: skipped is now labelled NOT RUN rather than
      # clean, and any conclusion that is neither success nor skipped (cancelled,
      # timed_out, a future value) fails instead of falling through the equality test.
      - name: Evaluate audit results
        env:
          NPM_VERDICT: ${{ needs.npm-audit.outputs.verdict }}
          BUNDLE_VERDICT: ${{ needs.bundle-audit.outputs.verdict }}
        run: |
          CHANGES="${{ needs.check-changes.result }}"
          NPM="${{ needs.npm-audit.result }}"
          BUNDLE="${{ needs.bundle-audit.result }}"
          {
            echo "## Security Audit Summary"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CHANGES" != success ]; then
            echo "::error::Dependency change detection ended as $CHANGES; audit coverage is unknown."
            echo "❌ Dependency change detection failed or did not run; audit coverage is unknown." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          label() {
            result="$1"
            verdict="$2"
            if [ "$result" = success ]; then
              case "$verdict" in
                clean) echo "✅ completed; no high/critical findings reported" ;;
                findings) echo "⚠️ findings reported; see audit report" ;;
                *) echo "❌ completed without a valid verdict" ;;
              esac
              return
            fi
            case "$1" in
              skipped) echo "⏭️ NOT RUN — no dependency manifest changed in this event" ;;
              *)       echo "❌ $1" ;;
            esac
          }
          {
            echo "- npm audit: $(label "$NPM" "$NPM_VERDICT")"
            echo "- bundle audit: $(label "$BUNDLE" "$BUNDLE_VERDICT")"
          } >> "$GITHUB_STEP_SUMMARY"

          bad=""
          for pair in "$NPM:$NPM_VERDICT" "$BUNDLE:$BUNDLE_VERDICT"; do
            result="${pair%%:*}"
            verdict="${pair#*:}"
            case "$result:$verdict" in
              success:clean|success:findings|skipped:) ;;
              *) bad="$bad $pair" ;;
            esac
          done
          if [ -n "$bad" ]; then
            echo "::error::Security audit job(s) ended in an unexpected state:$bad"
            exit 1
          fi

          if [ "$NPM" = "skipped" ] && [ "$BUNDLE" = "skipped" ]; then
            {
              echo "⏭️ Neither audit ran (no dependency manifest changed)."
              echo "This check passing does NOT mean dependencies were audited."
              echo "Coverage comes from the Monday cron, which audits unconditionally."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "⏭️ Neither audit ran — not a clean bill of health."
            exit 0
          fi
          echo "✅ Audits completed; findings are reported in the audit steps. Issue reconciliation runs only on the default branch."
