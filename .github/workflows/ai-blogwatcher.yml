name: AI BlogWatcher Auto Publish

on:
  repository_dispatch:
    types: [ai_blogwatcher]
  schedule:
    - cron: "0 0 * * *"  # 09:00 AM KST (UTC+9)
  workflow_dispatch:
    inputs:
      hours:
        description: "Hours to look back"
        required: false
        default: "24"
      max_news:
        description: "Maximum news items"
        required: false
        default: "15"
      mode:
        description: "Publish mode"
        required: false
        default: "security"
        type: choice
        options:
          - security
          - tech-blog
      dry_run:
        description: "Dry run (no commit)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      force_publish:
        description: "Force publish even if same-day post exists"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      use_ai:
        description: "AI enrichment"
        required: false
        default: "auto"
        type: choice
        options:
          - "auto"
          - "claude"
          - "gemini"
          - "gpt-5.4"
          - "codex-medium"
          - "deepseek"
          - "none"
      run_checks:
        description: "Run post checks"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions: {}

concurrency:
  group: ai-blogwatcher
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  auto-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Consumed by the notify-slack job below. `published_to_main` is set ONLY on
    # the trusted push-to-main branch of "Commit and publish" — the untrusted
    # repository_dispatch path quarantines the digest on a branch behind a review
    # PR, and a post that is not live must not announce itself.
    outputs:
      post_file: ${{ steps.check_post.outputs.post_file }}
      published_to_main: ${{ steps.publish.outputs.published_to_main }}
      published_sha: ${{ steps.publish.outputs.published_sha }}

    permissions:
      contents: write
      actions: read
      # repository_dispatch (untrusted external payload) opens a PR instead of
      # pushing to main; trusted schedule/dispatch still push directly.
      pull-requests: write

    env:
      HOURS: ${{ github.event.inputs.hours || github.event.client_payload.hours || '24' }}
      MAX_NEWS: ${{ github.event.inputs.max_news || github.event.client_payload.max_news || '15' }}
      MODE: ${{ github.event.inputs.mode || github.event.client_payload.mode || 'security' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || github.event.client_payload.dry_run || 'false' }}
      FORCE_PUBLISH: ${{ github.event.inputs.force_publish || github.event.client_payload.force_publish || 'false' }}
      USE_AI: ${{ github.event.inputs.use_ai || github.event.client_payload.use_ai || 'auto' }}
      RUN_CHECKS: ${{ github.event.inputs.run_checks || github.event.client_payload.run_checks || 'true' }}
      BLOGWATCHER_NEWS_URL: ${{ github.event.client_payload.collected_news_url || '' }}
      BLOGWATCHER_NEWS_JSON: ${{ github.event.client_payload.collected_news_json || '' }}
      BLOGWATCHER_PAYLOAD: ${{ toJson(github.event.client_payload) }}
      # SECRET PARTITION (MED-1, 2026-07-06 audit): the untrusted
      # repository_dispatch path runs the AI pipeline over an externally-authored
      # payload and is quarantined to a PR — but the PR partition protects `main`,
      # NOT the secrets. Withhold all LLM keys on that path so a poisoned feed can
      # never reach a live key (the untrusted digest publishes with no AI
      # enrichment; enrichment happens on human review/merge). The trusted
      # schedule/workflow_dispatch path is unaffected. Mirrored at the step-level
      # env below; guarded by test_ci_blogwatcher_secret_partition_guard.py.
      GEMINI_API_KEY: ${{ github.event_name != 'repository_dispatch' && secrets.GEMINI_API_KEY || '' }}
      CLAUDE_API_KEY: ${{ github.event_name != 'repository_dispatch' && secrets.CLAUDE_API_KEY || '' }}
      OPENAI_API_KEY: ${{ github.event_name != 'repository_dispatch' && secrets.OPENAI_API_KEY || '' }}
      DEEPSEEK_API_KEY: ${{ github.event_name != 'repository_dispatch' && secrets.DEEPSEEK_API_KEY || '' }}
      # Not a secret — a repo variable, so a retired Gemini model ID can be
      # swapped without a code change. Google retires these on its own schedule
      # and the published lifecycle dates do not match runtime, which is how
      # gemini-2.0-flash came to 404 on every call for weeks unnoticed.
      # Unset resolves to '' here, so every reader must treat empty as absent
      # (os.getenv's default does NOT fire on a set-but-empty var).
      AUTO_PUBLISH_GEMINI_MODEL: ${{ vars.AUTO_PUBLISH_GEMINI_MODEL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install system image tools
        run: sudo apt-get install -y --no-install-recommends librsvg2-bin

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Floor-pinned, reviewed dep set (2026-07-06 audit Item 2). Replaces
          # the prior inline unconstrained `pip install pkg pkg ...`. qrcode[pil]
          # pulls Pillow for svg_l22_generator.gen_qr (cover QR) and the
          # check_cover_qr_urls.py canonical-URL gate below.
          pip install -r requirements-blogwatcher.txt

      - name: Create directories
        run: mkdir -p _data data _posts assets/images

      - name: Ingest BlogWatcher payload
        if: github.event_name == 'repository_dispatch' || env.BLOGWATCHER_NEWS_URL != '' || env.BLOGWATCHER_NEWS_JSON != ''
        run: |
          PAYLOAD_JSON="${BLOGWATCHER_NEWS_JSON}"
          if [ -z "$PAYLOAD_JSON" ]; then
            PAYLOAD_JSON="${BLOGWATCHER_PAYLOAD}"
          fi

          python3 scripts/normalize_blogwatcher_payload.py \
            --output _data/collected_news.json \
            --payload-json "$PAYLOAD_JSON" \
            --payload-url "${BLOGWATCHER_NEWS_URL}"

      - name: Collect tech news from RSS
        if: env.BLOGWATCHER_NEWS_URL == '' && env.BLOGWATCHER_NEWS_JSON == ''
        run: |
          echo "Collecting news from last ${HOURS} hours..."
          timeout 480 python3 scripts/collect_tech_news.py --hours "${HOURS}" --output _data/collected_news.json --feed-timeout 15 || {
            echo "::warning::RSS collection timed out or failed, checking existing data..."
          }

          if [ ! -f "_data/collected_news.json" ] && [ -f "data/collected_news.json" ]; then
            cp data/collected_news.json _data/collected_news.json
            echo "::notice::Copied existing news data from data/ to _data/"
          fi

          if [ -f "_data/collected_news.json" ]; then
            cp _data/collected_news.json data/collected_news.json
          fi

      - name: Check collected news
        id: check_news
        run: |
          if [ -f "_data/collected_news.json" ]; then
            TOTAL=$(python3 -c "import json; d=json.load(open('_data/collected_news.json')); print(d.get('total_items', 0))")
            echo "news_count=$TOTAL" >> "$GITHUB_OUTPUT"
            echo "Collected $TOTAL news items"

            if [ "$TOTAL" -ge 5 ]; then
              echo "has_enough_news=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_enough_news=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Not enough news to publish (minimum: 5, got: $TOTAL)"
            fi
          else
            echo "news_count=0" >> "$GITHUB_OUTPUT"
            echo "has_enough_news=false" >> "$GITHUB_OUTPUT"
            echo "::error::No news collected - _data/collected_news.json not found"
          fi

      - name: Install Gemini CLI (optional)
        if: env.USE_AI == 'gemini' && env.GEMINI_API_KEY != ''
        run: |
          pip install --upgrade google-generativeai

          sudo tee /usr/local/bin/gemini > /dev/null << 'EOF'
          #!/usr/bin/env python3
          import os
          import sys
          import google.generativeai as genai

          api_key = os.getenv("GEMINI_API_KEY")
          if not api_key:
              print("Error: GEMINI_API_KEY environment variable not set", file=sys.stderr)
              sys.exit(1)

          genai.configure(api_key=api_key)
          # Same env override as the REST path (_cfg._GEMINI_MODEL). This shim
          # had its own hardcoded copy of the retired gemini-2.0-flash, so the
          # config fix in scripts/news/config.py did not reach it — the CLI is
          # tried BEFORE the REST call, so a stale ID here fails first on every
          # use_ai=gemini run.
          # `or` not os.getenv's default: the workflow always defines this var,
          # so an unset repo variable arrives as "" and the default never fires.
          model = genai.GenerativeModel(
              os.getenv("AUTO_PUBLISH_GEMINI_MODEL", "").strip() or "gemini-2.5-flash"
          )

          if len(sys.argv) > 2 and sys.argv[1] == "-p":
              prompt = sys.argv[2]
              try:
                  response = model.generate_content(prompt)
                  print(response.text)
              except Exception as exc:
                  print(f"Error: {exc}", file=sys.stderr)
                  sys.exit(1)
          elif "--version" in sys.argv:
              print("Gemini CLI wrapper v1.0")
              sys.exit(0)
          else:
              print("Usage: gemini -p 'prompt text'", file=sys.stderr)
              sys.exit(1)
          EOF

          sudo chmod +x /usr/local/bin/gemini

      - name: Auto publish digest
        if: steps.check_news.outputs.has_enough_news == 'true'
        env:
          # MED-1 secret partition: also gate the step-level re-declaration on the
          # trusted-path check (the untrusted repository_dispatch payload must not
          # reach a live key even here). Kept in lockstep with the job-level env.
          GEMINI_API_KEY: ${{ github.event_name != 'repository_dispatch' && (env.USE_AI == 'auto' || env.USE_AI == 'gemini') && secrets.GEMINI_API_KEY || '' }}
          CLAUDE_API_KEY: ${{ github.event_name != 'repository_dispatch' && (env.USE_AI == 'auto' || env.USE_AI == 'claude') && secrets.CLAUDE_API_KEY || '' }}
          OPENAI_API_KEY: ${{ github.event_name != 'repository_dispatch' && (env.USE_AI == 'auto' || env.USE_AI == 'gpt-5.4' || env.USE_AI == 'codex-medium') && secrets.OPENAI_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ github.event_name != 'repository_dispatch' && (env.USE_AI == 'auto' || env.USE_AI == 'deepseek') && secrets.DEEPSEEK_API_KEY || '' }}
          # 2026-05-26: L22 ultra deprecated in favor of L20 family unification.
          # L20 Hero+2-Card now emits the same QR block at translate(1080,504)
          # via svg_l22_generator.qr_block, and strips Hangul consistently
          # (the L22 _resolve_three_stories path retained Korean and tripped
          # the unified SVG quality gate on 2026-05-23..26).
          # USE_L20_HERO defaults to "1"; no explicit env needed.
        run: |
          # Validate MODE against whitelist
          case "${MODE}" in
            security|tech-blog) ;;
            *) echo "::error::Invalid mode: ${MODE}"; exit 1 ;;
          esac

          args=(--hours "${HOURS}" --max-news "${MAX_NEWS}" --mode "${MODE}" --use-ai "${USE_AI}")

          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi

          if [ "${FORCE_PUBLISH}" = "true" ]; then
            args+=(--force)
          fi

          echo "Running: python3 scripts/auto_publish_news.py ${args[*]}"
          python3 scripts/auto_publish_news.py "${args[@]}"

      # The digest quality gate deletes the draft it rejects — correct, but it
      # also destroyed the only evidence. The 2026-08-27 run reported one
      # 60-character fragment ("...정부 복지에 의") and the file was already
      # gone, so whether our truncation helpers or the model produced the cut
      # could not be determined. auto_publish_news.py now copies the draft aside
      # before unlinking; this uploads it.
      #
      # `failure()` and not `always()`: on success the directory does not exist
      # and an unconditional upload would log a "no files found" warning on
      # every healthy run, which is how real warnings stop being read.
      - name: Upload rejected draft (quality gate diagnostics)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: digest-gate-failure-${{ github.run_id }}
          path: .digest-gate-failure/
          if-no-files-found: ignore
          retention-days: 14

      - name: Check for new post
        id: check_post
        if: steps.check_news.outputs.has_enough_news == 'true'
        run: |
          TODAY=$(date +%Y-%m-%d)
          POST_FILE=$(find _posts -maxdepth 1 -type f \( -name "${TODAY}-*Digest*.md" -o -name "${TODAY}-*Weekly*.md" \) -print | sort -u | head -1)

          if [ -n "$POST_FILE" ] && [ -f "$POST_FILE" ]; then
            echo "post_created=true" >> "$GITHUB_OUTPUT"
            echo "post_file=$POST_FILE" >> "$GITHUB_OUTPUT"
            echo "Post created: $POST_FILE"
          else
            echo "post_created=false" >> "$GITHUB_OUTPUT"
            echo "No post created for today"
          fi

      - name: Verify L20 cover (QR block present)
        id: cover
        if: steps.check_post.outputs.post_created == 'true' && env.DRY_RUN != 'true'
        run: |
          # Asserts today's auto-published SVG is an L20 family cover with
          # a QR block at translate(1080,504). The L22 lower-bound was
          # removed on 2026-05-26 when the pipeline unified on L20 — L20
          # covers typically range 26-75 KB depending on content density
          # (excerpts with short news headlines compress more aggressively).
          TODAY=$(date +%Y-%m-%d)
          SVG=$(find assets/images -maxdepth 1 -type f \
              \( -name "${TODAY}-*Digest*.svg" -o -name "${TODAY}-*Weekly*.svg" \) \
              -print | sort -u | head -1)
          if [ -z "$SVG" ] || [ ! -f "$SVG" ]; then
            echo "::error::No SVG cover found for ${TODAY}"
            exit 1
          fi
          SIZE=$(stat -c '%s' "$SVG" 2>/dev/null || stat -f '%z' "$SVG")
          echo "Cover: $SVG"
          echo "Size:  ${SIZE} bytes"
          # Sanity floor: L20 covers are >=20 KB. Legacy generate_svg_image
          # fallback produces ~10 KB plain SVGs without a QR block. The
          # 2026-05-27 auto-publish came in at 26 KB on a tight excerpt
          # (smallest observed L20), so the floor sits well below that
          # while still cleanly separating from the legacy fallback.
          if [ "${SIZE}" -lt 20000 ]; then
            echo "::error::Cover ${SIZE}B is too small — likely legacy fallback. Expected L20 (>=20000B)."
            exit 1
          fi
          if ! grep -q 'translate(1080,504)' "$SVG"; then
            echo "::error::Cover ${SVG} missing QR block at translate(1080,504)."
            exit 1
          fi
          echo "OK: L20 cover with QR block confirmed (${SIZE} bytes)."

          # --- Correctness gates (mirror the PR-side svg-lint / check-svg CI so
          # auto-published covers can never regress what those gates enforce).
          # Scoped to today's cover via the resolved $SVG path (no glob no-match
          # risk). check_cover_qr_urls.py = QR encodes the canonical permalink;
          # check_svg_title_ascii.py = <title>/<desc> ASCII-only; check_svg_quality
          # = no Korean / banned chars in body <text>. These caught the
          # 2026-06-03..05 cron covers (non-canonical QR + "Cisco FMC·" title)
          # only after the fact on a PR merge; running them here fails the cron
          # before the bad cover is committed.
          # Published for the QR self-heal step below, which needs the same
          # resolved path. Re-running the `find` there would let the two steps
          # disagree about which file today's cover is.
          echo "svg=${SVG}" >> "$GITHUB_OUTPUT"

          echo "Running cover correctness gates on ${SVG} ..."
          # check_cover_qr_urls moved to its own step below — it is the one gate
          # here with a deterministic repair, and it must end its step to block.
          python3 scripts/check_svg_title_ascii.py "${SVG}"
          python3 scripts/check_svg_quality.py --ci "${SVG}"
          # No hero-scale advisory shield in a side card (occludes the band
          # headline + duplicates). The generator demotes side-card advisory to
          # a neutral motif; this fails the cron if it ever regresses.
          python3 scripts/check_l20_sidecard_advisory.py "${SVG}"
          # Two more cover gates that svg-lint has always run and the cron never
          # did. Both take the resolved $SVG, so they are scoped to today's cover
          # exactly like the four above.
          #   check_l20_generic_hero  — hero band must carry a real summary_card
          #     headline, not a generic-pool string like "Security Update". Note
          #     it reads the COVER, not the post: handed a post path it reports
          #     "0 L20 cover(s) checked" and exits 0, which reads as a pass.
          #   check_svg_size_gate     — cover size stays inside its std/hq/rollup
          #     band.
          python3 scripts/check_l20_generic_hero.py "${SVG}"
          python3 scripts/check_svg_size_gate.py "${SVG}"
          echo "OK: ASCII <title> + body-text quality + side-card advisory + generic-hero + size-band gates passed."

      - name: Cover QR URL pre-flight (self-heal, then block)
        if: steps.check_post.outputs.post_created == 'true' && env.DRY_RUN != 'true'
        run: |
          # This gate cost a whole digest. On 2026-09-04 the 02:04Z cron failed
          # here on 2026-09-04-Tech_Security_Weekly_Digest_AI_Malware_Rust.svg
          # ("Failures: 1 [mismatch]") and published nothing; GitHub does not
          # backfill a cron cycle, so that day is simply gone. It had blocked
          # one other scheduled run in the preceding 40 (2026-08-23), so the
          # trade was rare-but-total: a day of content for a wrong QR code.
          #
          # Self-heal does not relax the rule. The rule was "never commit a bad
          # cover", and fix_qr_url_in_covers rewrites the QR block from the
          # canonical permalink derived from the filename — so what gets
          # committed is a *corrected* cover, not an unverified one. Verified
          # end-to-end 2026-09-04 on the 09-03 cover: swapping in a QR for a
          # bogus slug made the gate report Failures: 1, the fixer restored it
          # (Changed: 1), the re-check returned OK, and the result was
          # byte-identical to the original file.
          #
          # Warned, never silently absorbed. No QR decoder is shipped (by
          # design — see the script docstring), so the gate cannot say which URL
          # the QR actually encoded, and a healed mismatch is the only trace a
          # generator bug leaves behind. Without the `::warning::` a recurring
          # cause would vanish into a green job, which is how this repo has
          # twice ended up with a gate that reported clean.
          SVG="${{ steps.cover.outputs.svg }}"
          if [ -z "$SVG" ] || [ ! -f "$SVG" ]; then
            echo "::error::cover path not resolved by the Verify L20 cover step"
            exit 1
          fi
          if ! python3 scripts/check_cover_qr_urls.py --glob "$SVG"; then
            echo "::warning::Cover QR URL mismatch on ${SVG} — attempting fix_qr_url_in_covers self-heal."
            python3 scripts/fix_qr_url_in_covers.py --commit --glob "$SVG" || true
          fi
          python3 scripts/check_cover_qr_urls.py --glob "$SVG"

      - name: Validate new post
        if: env.RUN_CHECKS == 'true' && steps.check_post.outputs.post_created == 'true'
        run: |
          POST_FILE="${{ steps.check_post.outputs.post_file }}"
          python3 scripts/check_posts.py "$POST_FILE"
          python3 scripts/verify_images_unified.py --missing

      - name: Briefing severity consistency tests
        if: env.RUN_CHECKS == 'true' && steps.check_post.outputs.post_created == 'true'
        run: |
          # Enforce: newly published post's briefing "N건" claims match rendered severity tags.
          # The integration test honors CUTOFF_ISO so it won't fail on historical posts
          # but will fail immediately if today's auto-generated post regresses.
          pytest scripts/tests/test_briefing_stats.py -x --tb=short -q

      - name: Lone-adjective cover pre-flight (warn — vetting needed)
        if: env.RUN_CHECKS == 'true' && steps.check_post.outputs.post_created == 'true'
        run: |
          # Surface an unvetted lone-adjective+AI cover panel (e.g. "Claude AI" ->
          # lone "Claude") at PUBLISH time. TestCorpusNoLoneAdjectiveAi would
          # otherwise fail on main only AFTER this cron pushes (silent, delayed).
          # WARN, do NOT block: vetting (join vs defer in l20_dispatch) is a human
          # decision, and the digest must still publish. The maintainer gets the
          # exact word + remediation here instead of a cryptic later CI failure.
          POST_FILE="${{ steps.check_post.outputs.post_file }}"
          if ! python3 scripts/check_digest_lone_adjective.py "$POST_FILE"; then
            echo "::warning::Unvetted lone-adjective+AI cover panel in ${POST_FILE}. main's TestCorpusNoLoneAdjectiveAi will go red until you vet the word in scripts/news/l20_dispatch.py (_AI_COMPOUND_ADJECTIVES to join, or _DEFERRED_AI_ADJECTIVES if the lone lead is a correct brand)."
          fi

      - name: Canonical checklist heading pre-flight (self-heal, then block)
        if: env.RUN_CHECKS == 'true' && steps.check_post.outputs.post_created == 'true'
        run: |
          # Guard the 601 -> 0 structure campaign against cron re-drift. The
          # pre-commit structural ratchet never sees this post: the Actions
          # commit below runs with no local hooks. And check_digest_structure
          # counts the raw substring "## 실무 체크리스트", so a demoted
          # (### …) or suffixed (… (P0)) heading passes it silently.
          #
          # Self-heal first — the numbered tier-C form (## N. 실무 체크리스트)
          # is deterministically fixable by restore_digest_structure R5, and
          # that rule is lossless (it aborts rather than drop content). Then
          # re-verify and BLOCK: unlike the lone-adjective warn above, this is
          # not a judgement call, and a drifted surface silently rots the
          # corpus until a manual campaign finds it weeks later.
          POST_FILE="${{ steps.check_post.outputs.post_file }}"
          if ! python3 scripts/check_digest_checklist_heading.py "$POST_FILE"; then
            echo "::warning::Non-canonical checklist heading in ${POST_FILE} — attempting restore_digest_structure self-heal."
            python3 scripts/restore_digest_structure.py "$POST_FILE" || true
          fi
          python3 scripts/check_digest_checklist_heading.py "$POST_FILE"

      - name: Digest structure pre-flight (self-heal, then block)
        if: env.RUN_CHECKS == 'true' && steps.check_post.outputs.post_created == 'true'
        run: |
          # The heading step above checks ONE surface: that the canonical
          # "## 실무 체크리스트" H2 exists. check_digest_structure checks the
          # rest of the shape — and the two do not overlap. On 2026-08-26 the
          # cron published a post whose heading was canonical (that step passed)
          # but whose item bodies carried per-item "- [ ]" checkboxes. The
          # corpus had been driven to 0 violations by the 601 -> 0 campaign, so
          # main went red the moment the bot pushed.
          #
          # Nothing in the publish path was looking: check_digest_structure runs
          # --all in svg-lint (which fires AFTER the push) and --staged in
          # pre-commit (which the Actions commit bypasses, no local hooks). The
          # gate existed and the cron simply never ran it.
          #
          # restore_digest_structure fixes this class deterministically — it
          # strips the checkbox markers and keeps the prose, and it aborts
          # rather than drop content. Verified on the 08-26 post: FAIL -> OK,
          # 24 bytes removed, exactly the six "[ ] " markers.
          POST_FILE="${{ steps.check_post.outputs.post_file }}"
          if ! python3 scripts/check_digest_structure.py "$POST_FILE"; then
            echo "::warning::Digest structure violation in ${POST_FILE} — attempting restore_digest_structure self-heal."
            python3 scripts/restore_digest_structure.py "$POST_FILE" || true
          fi
          python3 scripts/check_digest_structure.py "$POST_FILE"

      - name: Template-echo summary pre-flight (self-heal, then block)
        if: env.RUN_CHECKS == 'true' && steps.check_post.outputs.post_created == 'true'
        run: |
          # A template-echo summary repeats the headline and bolts on one of
          # three fixed clauses; it describes no article. 490 accumulated
          # unnoticed before PRs #521/#525 cleared them, because nothing failed
          # when one landed. The pre-commit gate cannot see this post: the
          # Actions commit below runs with no local hooks.
          #
          # Self-heal first — rewrite_template_echo_summaries lifts the first
          # sentences of the prose paragraph the post already carries under each
          # card. No network, no LLM, and each mode enforces its own runtime
          # contract (REPLACE may change nothing but a summary= VALUE; DROP may
          # only delete whole summary= lines from spotlight items), aborting
          # rather than writing a violation.
          #
          # Then re-verify and BLOCK. Unlike the lone-adjective warn above this
          # is not a judgement call: the clause is either there or it is not,
          # and a survivor means the post has no prose to ground the summary in,
          # which needs a human.
          POST_FILE="${{ steps.check_post.outputs.post_file }}"
          if ! python3 scripts/check_template_echo.py "$POST_FILE" --quiet; then
            echo "::warning::Template-echo summary in ${POST_FILE} — attempting rewrite_template_echo_summaries self-heal."
            python3 scripts/rewrite_template_echo_summaries.py "$POST_FILE" || true
          fi
          python3 scripts/check_template_echo.py "$POST_FILE" --quiet

      - name: Proper-noun pre-flight (self-heal, then block)
        if: env.RUN_CHECKS == 'true' && steps.check_post.outputs.post_created == 'true'
        run: |
          # Canonicalize Hangul transliterations of proper nouns (비트코인 -> Bitcoin).
          # Body text only; front matter untouched; deny-by-default allow-list; quoted
          # prose titles, CVE ids, code and URLs are masked out.
          #
          # This ran inside "Commit and publish" as `--fix … || true` with NO
          # re-verification — the only one of the four cron self-heals that never
          # checked its own work. Two things made that leak: the pre-commit gate cannot
          # see this post (the Actions commit runs with no local hooks), and the
          # svg-lint proper-noun gate is diff-scoped (`--changed BASE`), so it only
          # catches the bot's digest when that digest happens to be HEAD~1 at 03:45 UTC.
          # Any other commit landing in between and a --fix failure ships uncaught.
          #
          # Now it follows the same shape as the checklist-heading and template-echo
          # steps above: self-heal, re-verify, BLOCK. Blocking is the established
          # precedent for this class — the substitution is deterministic and
          # allow-listed, so a survivor is not a judgement call, it is a token the
          # allow-list does not cover and a human should decide on. The alternative is
          # the silent corpus rot that took the 98 -> 75 manual campaign to undo.
          POST_FILE="${{ steps.check_post.outputs.post_file }}"
          if ! python3 scripts/check_digest_proper_nouns.py "$POST_FILE"; then
            echo "::warning::Hangul proper noun in ${POST_FILE} — attempting --fix self-heal."
            python3 scripts/check_digest_proper_nouns.py --fix "$POST_FILE" || true
          fi
          python3 scripts/check_digest_proper_nouns.py "$POST_FILE"

      - name: Untranslated-summary pre-flight (self-heal, then block)
        if: env.RUN_CHECKS == 'true' && steps.check_post.outputs.post_created == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # An English 요약/summary= is a dropped HTTP call, not a style issue:
          # when every translation backend returns "" the generator emits the
          # source English verbatim. Until now nothing looked before the commit,
          # so it shipped to main and was caught hours later — by the svg-lint
          # --all gate on some unrelated PR (that is how #605 found the two
          # 2026-08-25 items) or by the 01:30 UTC backfill, which fixes it via a
          # PR someone still has to merge.
          #
          # Same shape as the three self-heals above: heal, re-verify, block.
          # The one difference is that this heal needs a network backend, so the
          # block is conditional on having had one. On repository_dispatch the
          # LLM keys are deliberately zeroed (MED-1), retranslate_digest is a
          # graceful no-op, and that path opens a review PR rather than pushing
          # to main — blocking there would kill the PR that carries the very
          # post a human is meant to look at. So: warn there, block here.
          POST_FILE="${{ steps.check_post.outputs.post_file }}"
          if ! python3 scripts/check_digest_untranslated.py "$POST_FILE"; then
            echo "::warning::Untranslated English in ${POST_FILE} — attempting retranslate_digest self-heal."
            python3 scripts/retranslate_digest.py "$POST_FILE" || true
          fi
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            python3 scripts/check_digest_untranslated.py "$POST_FILE" \
              || echo "::warning::Untranslated English survives in ${POST_FILE}. This is the untrusted dispatch path, which holds no LLM keys, so no translation was possible. The review PR this run opens carries the untranslated text — translate it before merging."
            exit 0
          fi
          python3 scripts/check_digest_untranslated.py "$POST_FILE"

      - name: Corpus gate pre-flight (block)
        if: env.RUN_CHECKS == 'true' && steps.check_post.outputs.post_created == 'true'
        run: |
          # Gates that svg-lint runs daily at 03:45 UTC and the cron never ran.
          # The cron pushes at 00:00 UTC, so a violation it introduces sits on
          # main for ~3h45m before anything objects — and every PR opened in that
          # window inherits the red, because PR CI builds a merge commit on top of
          # base main. Measured on the 08-25 digest: cron pushed 98a4170d, the
          # scheduled sweep failed it at 04:23 UTC.
          #
          # Why --all and not a path: these eight take `--all` or `--staged` and
          # nothing else. `--staged` is meaningless here (the Actions commit has
          # no local hooks and the files are not staged at this point), so --all
          # is the only usable mode. It is affordable — all eight together run in
          # about 5 seconds over 277 posts.
          #
          # A corpus-wide gate can in principle fail on a violation someone else
          # introduced rather than on today's digest. That is acceptable: every
          # one of these is at 0 across the corpus today, deliberately (the
          # 601 -> 0 structure campaign, the 48-title translation pass), and if a
          # human has pushed a violation then main is ALREADY red and the cron
          # refusing to add a post on top of it is the correct behaviour, not a
          # false alarm. Read the failing path in the output before assuming the
          # digest caused it.
          POST_FILE="${{ steps.check_post.outputs.post_file }}"

          # Post-scoped: filename date vs the UTC permalink date. The cron writes
          # the date, so it can drift here on its own.
          python3 scripts/check_kst_midnight.py "$POST_FILE"

          # Corpus-scoped.
          python3 scripts/check_card_title_language.py --all
          python3 scripts/check_post_boilerplate.py --all
          python3 scripts/check_broken_links.py --all
          python3 scripts/check_spec_slug_consistency.py --all
          python3 scripts/check_l20_spec_slug_consistency.py --all
          python3 scripts/check_post_image_variants.py
          python3 scripts/check_orphan_cover_rasters.py assets/images
          # Only green since 2026-08-26. It had never been run at --all — it was
          # wired into pre-commit as --staged only — and two entity-residue
          # filenames in assets/images/_unused_archive/ had been failing it since
          # they were archived. Wiring it before that cleanup would have made the
          # cron fail every night. Run a dormant gate before you wire it.
          python3 scripts/check_filename_entities.py --all

          # The whole pytest suite, not just the corpus check_*.py gates above.
          # Every guard in scripts/tests/ that reads _posts/ — excerpt quality,
          # digest structure, cover honesty — runs only in jekyll.yml's build
          # job, and that job never fires for this push: a commit made with the
          # default GITHUB_TOKEN triggers no push-event workflows. Measured
          # 2026-09-03 on 35854337: 1 run total (CodeQL 'dynamic'), 0 push-event
          # runs, against 9 for the comparable human push b81ed099. So until
          # this line existed, a digest could introduce a duplicate excerpt and
          # nothing would object until the next human push or PR.
          #
          # Feasibility measured in a clean venv holding only
          # requirements-blogwatcher.txt: 5169 passed / 5 skipped in 85s once
          # fonttools, python-dotenv and ruff were added there (they were, in
          # the same commit). No Ruby or built _site here, so the
          # jekyll-build and compiled-CSS tests skip by design.
          python3 -m pytest scripts/tests/ -q --no-header -p no:randomly

      - name: Commit and publish
        id: publish
        if: steps.check_post.outputs.post_created == 'true' && env.DRY_RUN != 'true'
        env:
          # gh pr create needs a token; EVENT_NAME/RUN_ID via env (no ${{ }} in run body).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          TODAY=$(date +%Y-%m-%d)

          # Proper-noun canonicalization moved to its own pre-flight step above
          # ("Proper-noun pre-flight"), which self-heals and then RE-VERIFIES.
          # It used to run here as `--fix … || true` with no re-verification: the
          # only one of the four cron self-heals that never checked its own work.

          git add "_posts/${TODAY}"*.md 2>/dev/null || true
          git add "assets/images/${TODAY}"*.svg 2>/dev/null || true
          git add "assets/images/${TODAY}"*.png 2>/dev/null || true
          git add "assets/images/${TODAY}"*.avif 2>/dev/null || true
          git add "assets/images/${TODAY}"*.webp 2>/dev/null || true
          git add "_data/collected_news.json" 2>/dev/null || true
          git add "_data/published_news_urls.json" 2>/dev/null || true
          git add "data/collected_news.json" 2>/dev/null || true

          # Self-heal the post-quality baseline. A cron-added digest missing from
          # scripts/tests/fixtures/quality_baseline.json leaves
          # test_regen_quality_baseline red on main (and every rebased PR).
          # Refresh it and stage it into THIS digest commit so both the trusted
          # push-to-main and untrusted PR paths stay green. Non-blocking: a regen
          # failure must never stop the digest from publishing.
          if python3 scripts/regen_quality_baseline.py; then
            git add "scripts/tests/fixtures/quality_baseline.json" 2>/dev/null || true
          else
            echo "::warning::regen_quality_baseline failed; digest will publish but the quality baseline may go stale (main CI may need a manual 'python3 scripts/regen_quality_baseline.py' refresh)."
          fi

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "feat: auto publish digest via blogwatcher - ${TODAY}"

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            # MEDIUM-1: an external repository_dispatch payload is untrusted
            # (SSRF/feed-poisoning boundary). Do NOT push to main — open a PR so
            # a human reviews and required CI runs before the digest goes live.
            BRANCH="blogwatcher/digest-${TODAY}-${RUN_ID}"
            git checkout -b "$BRANCH"
            git push origin "$BRANCH"
            # The untrusted digest is now quarantined on $BRANCH; main is NOT
            # updated regardless of whether the PR opens. Try to open the review
            # PR — if the org/repo blocks Actions from creating PRs, fail with
            # actionable guidance rather than a cryptic error (verified E2E
            # 2026-07-03: branch push succeeds, gh pr create needs the repo
            # setting below or a PAT/App token).
            if gh pr create --base main --head "$BRANCH" \
              --title "auto digest (blogwatcher external payload) - ${TODAY}" \
              --body "Automated digest built from an external \`repository_dispatch\` payload. This path is untrusted (SSRF/feed-poisoning boundary), so it opens a PR instead of pushing to main. Review the post + cover and let CI go green before merging."; then
              echo "Opened review PR from $BRANCH (untrusted external-payload path)"
            else
              echo "::error::Could not auto-open the review PR. The digest is safely quarantined on branch '${BRANCH}' (main was NOT updated)."
              echo "::error::Fix: enable Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests', or use a PAT/App token. Meanwhile open it manually:"
              echo "::error::  ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
              exit 1
            fi
          else
            # Trusted path (schedule / manual workflow_dispatch, repo RSS content)
            # keeps the existing direct push to main.
            for i in 1 2 3; do
              if git push; then
                echo "Changes committed and pushed (attempt $i)"
                # Signal the notify-slack job. Set only here — inside the trusted
                # branch, after a push that actually succeeded. A retry that
                # eventually fails falls through to `exit 1` below and leaves
                # these unset, so no announcement goes out for an unpublished post.
                {
                  echo "published_to_main=true"
                  echo "published_sha=$(git rev-parse HEAD)"
                } >> "$GITHUB_OUTPUT"
                break
              else
                echo "Push failed (attempt $i), pulling latest..."
                git pull --rebase origin main || true
                if [ $i -eq 3 ]; then
                  echo "Push failed after 3 attempts"
                  exit 1
                fi
              fi
            done
          fi

      - name: Summary
        if: always()
        run: |
          summary_file="$GITHUB_STEP_SUMMARY"
          {
            echo "## AI BlogWatcher Summary"
            echo ""
            echo "- Mode: ${MODE}"
            echo "- Hours lookback: ${HOURS}"
            echo "- Max news: ${MAX_NEWS}"
            echo "- Dry run: ${DRY_RUN}"
            echo "- Use AI: ${USE_AI}"
            echo "- News count: ${{ steps.check_news.outputs.news_count }}"
            echo "- Post created: ${{ steps.check_post.outputs.post_created }}"
          } >> "$summary_file"

  # Announce the digest that auto-publish just pushed.
  #
  # slack-post-notify.yml has always been the right workflow for this and has
  # never once run for a cron digest. Its only trigger was `push: _posts/**` on
  # main, and the bot pushes with GITHUB_TOKEN — which GitHub deliberately does
  # not let trigger further workflow runs (recursion prevention). Measured
  # 2026-08-26: the last four bot commits (da730a40, 98a4170d, 233943cf,
  # a4843c8e) appear in that workflow's run history zero times; every run on
  # record is on a human SHA. So every auto-published digest since the bot
  # arrangement began went out with no Slack announcement at all.
  #
  # Calling it via `workflow_call` rather than adding a `schedule` to it: that
  # workflow identifies the new post with `git diff HEAD~1 HEAD`, which is only
  # correct when the digest commit is the tip. A timer would be a guess about
  # what HEAD~1 means at that moment. Here we pass the exact path and the exact
  # commit, so there is nothing to infer.
  notify-slack:
    needs: auto-publish
    if: needs.auto-publish.outputs.published_to_main == 'true'
    # This workflow is deny-by-default (`permissions: {}` at the top) and each
    # job re-grants what it needs. A called workflow cannot hold more than its
    # caller, so without this the callee's `contents: read` is cut to nothing and
    # actions/checkout fails — after the digest is already live, which is the
    # worst place to discover it. Read-only: this job publishes nothing.
    permissions:
      contents: read
    uses: ./.github/workflows/slack-post-notify.yml
    with:
      post_path: ${{ needs.auto-publish.outputs.post_file }}
      ref: ${{ needs.auto-publish.outputs.published_sha }}
    secrets: inherit

  # Rebuild the GH Pages backup as soon as the digest is live, instead of
  # waiting for deploy-pages' own 00:30Z cron to notice.
  #
  # The bot's GITHUB_TOKEN push cannot fire that workflow's `push:` trigger
  # (GitHub recursion prevention), so the cron was the ONLY thing keeping the
  # backup in sync — and on 2026-08-27 the scheduler dropped ~10 hours of
  # events repo-wide. Missed cycles are not backfilled, so trigger and safety
  # net were both out on the same day and the backup served 404 for that
  # digest while production served 200.
  #
  # The cron stays. This is the event-driven path; that is the backstop for the
  # cases this job cannot see (a failed call, or a stale backup from any other
  # cause). Two independent paths, no shared point of failure.
  deploy-backup:
    needs: auto-publish
    if: needs.auto-publish.outputs.published_to_main == 'true'
    # Same deny-by-default re-grant as notify-slack above, but this callee
    # deploys, so it needs the Pages trio. A called workflow cannot hold more
    # than its caller grants.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      # auto-publish ran on the pre-publish SHA. Without this the backup would
      # rebuild the corpus WITHOUT the post that just triggered it.
      ref: ${{ needs.auto-publish.outputs.published_sha }}
