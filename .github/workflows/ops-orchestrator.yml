name: Ops Orchestrator

# Consolidates the former ops-multi-agent-loop.yml, ops-priority-loop.yml,
# ultrawork-loop.yml and ai-ops-on-demand.yml into ONE file with three
# mutually-exclusive, if:-gated jobs. Each job keeps its own least-privilege
# permissions and secret scoping — the merge is behaviour-preserving.
#
# SECURITY (do not regress):
#   * actions:write / issues:write live ONLY in the `multi_agent` job and are
#     unreachable from the untrusted `repository_dispatch` path (that path only
#     runs `on_demand`, which has contents:read).
#   * `on_demand` keeps step-scoped secrets (MED-2 hardening, dd0fc74e): the
#     job-level env carries only non-secret toggles + boolean has-secret flags;
#     real secrets are declared on the individual steps that use them.
#   * `priority` carries NO secrets at all since 2026-09-18 — the strongest form
#     of the same rule. Its only secret use was an AI-Gateway Slack step that had
#     never executed (AI_GATEWAY_URL/TOKEN + SLACK_CHANNEL_ID_OPS unprovisioned),
#     removed along with its two siblings in the other jobs.
# Guarded by scripts/tests/test_ci_ops_orchestrator_partition_guard.py.

on:
  schedule:
    - cron: "0 */6 * * *"   # multi_agent lane (default ON)
    - cron: "0 4 * * *"     # priority lane (default OFF)
  workflow_dispatch:
    inputs:
      profile:
        description: "Which ops profile to run"
        required: false
        default: "full"
        type: choice
        options:
          - "full"          # multi_agent + on_demand
          - "multi-agent"   # multi_agent only
          - "priority"      # priority only
      run_lint_checks:
        description: "Run lint/type checks (on_demand)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      run_vercel_checks:
        description: "Run Vercel checks (on_demand)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      run_github_actions_checks:
        description: "Run GitHub Actions checks (on_demand)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      run_sentry_checks:
        description: "Run Sentry checks (on_demand)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      run_uiux_checks:
        description: "Run UI/UX checks (on_demand)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      auto_recover_gha:
        description: "Auto rerun failed GitHub Actions workflows"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  repository_dispatch:
    types: [ai_ops_task]

permissions:
  contents: read

concurrency:
  group: ops-orchestrator-${{ github.event_name }}-${{ github.event.schedule || github.event.action || github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  # multi_agent — 6h cron OR dispatch profile full/multi-agent.
  # Full roundtable: lint+vercel+gha+sentry+uiux, auto-recover, artifact + Slack
  # + create-issue-on-failure. Elevated perms (actions:write, issues:write) and
  # job-level secrets. NOT reachable from repository_dispatch.
  # ---------------------------------------------------------------------------
  multi_agent:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 */6 * * *' && vars.OPS_MULTI_AGENT_SCHEDULE != 'false')
      || (github.event_name == 'workflow_dispatch' && (github.event.inputs.profile == 'full' || github.event.inputs.profile == 'multi-agent'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
      issues: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: "20"

      - name: Install CLI dependencies
        # ruff is pinned to the same version python-lint.yml installs. Since
        # 2026-08-28 the two share a verdict — the PR gate runs
        # `ruff format --check scripts/` and check_lint_and_types() derives `ok`
        # from the same command — so a version skew makes one of them fail on a
        # rule the other does not have. That is not hypothetical: unpinned here,
        # ruff resolved to 0.16, which formats Python inside Markdown, and
        # scripts/AGENTS.md (untouched since 2026-04-08) turned the 03:19Z run
        # of 2026-08-31 red against a PR gate that called the tree clean.
        #
        # Both gates moved 0.15.8 -> 0.16.6 together on 2026-09-15 so they
        # satisfy the `ruff>=…` that scripts/requirements-ci.txt and
        # requirements-blogwatcher.txt declare; both sides are now 0.16.7.
        # Markdown formatting is therefore in scope deliberately — all 6 .md
        # files under scripts/ were verified clean under the pin first. Raising
        # this again means moving all four `ruff==` sites AND both declarations
        # in one PR; the guard in test_ci_python_lint_gate.py says so by name.
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'ruff==0.16.7' mypy
          npm i -g vercel
          gh --version
          vercel --version

      - name: Run multi-agent roundtable checks
        id: roundtable
        env:
          AUTO_RECOVER_GHA: ${{ github.event.inputs.auto_recover_gha || 'true' }}
        run: |
          set -euo pipefail
          mkdir -p reports
          args=(--output reports/ops-roundtable.md --json-output reports/ops-roundtable.json)
          if [ "${AUTO_RECOVER_GHA}" = "true" ]; then
            args+=(--auto-recover-gha)
          fi
          python3 scripts/ops_health_orchestrator.py "${args[@]}"

      - name: Upload roundtable report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: ops-roundtable-report
          path: reports/

      - name: Add report to job summary
        if: always()
        run: |
          if [ -f reports/ops-roundtable.md ]; then
            cat reports/ops-roundtable.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Ops roundtable report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Export report output
        id: report
        if: always()
        run: |
          if [ -f reports/ops-roundtable.md ]; then
            {
              echo "message<<EOF"
              cat reports/ops-roundtable.md
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "message=Ops roundtable report missing." >> "$GITHUB_OUTPUT"
          fi

      # The body INLINES the report. It used to carry only a link to the
      # `ops-roundtable-report` artifact, and artifacts expire after 90 days —
      # so every one of these issues became unactionable on a timer regardless
      # of whether anyone read it. Measured 2026-09-18 over the 21 open ones:
      # #191 (03-23), #394 (06-08) and #400 (06-09) all had ZERO surviving
      # artifacts; only #643 (08-31) still had its. 20 of 21 had already lost
      # their only evidence.
      #
      # Inlining does not widen exposure: the same text is already written to
      # $GITHUB_STEP_SUMMARY on a public repo, and the report names credentials
      # only by presence ("Skipped (VERCEL_TOKEN not set)") — never values.
      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          REPORT: ${{ steps.report.outputs.message }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            // Dedup matches on TITLE_PREFIX, not the full title. The full title
            // carries the date, and the old check was `issue.title === title` —
            // so the date made every day's title unique and the check could
            // never fire. Two failure streaks each opened one issue per day:
            // 2026-03-23…04-03 (12 consecutive) and 2026-06-02…06-09 (8). That
            // is 20 of the 21 issues this dedup existed to prevent.
            const TITLE_PREFIX = '🚨 Ops multi-agent loop failed';
            const title = `${TITLE_PREFIX} (${today})`;

            // GitHub caps an issue body at 65536 chars. Budget well under it so
            // the surrounding prose always fits, and say so when truncating —
            // a silently cut report is the same defect as an expired artifact.
            const LIMIT = 50000;
            const raw = (process.env.REPORT || '').trim();
            let report = raw || '(report was not generated — see the workflow run)';
            if (report.length > LIMIT) {
              report = report.slice(0, LIMIT) +
                `\n\n… truncated at ${LIMIT} chars; full text in the run log / artifact.`;
            }

            const body = [
              'Ops multi-agent checks found unresolved P1/P0 issues.',
              '',
              `- Workflow run: ${runUrl}`,
              '- Artifact: `ops-roundtable-report` (expires 90 days after the run)',
              '',
              'Suggested actions:',
              '- Triage Vercel/GitHub Actions/Sentry issues first',
              '- Re-run workflow after fixes',
              '',
              '<details><summary>reports/ops-roundtable.md (inlined — outlives the artifact)</summary>',
              '',
              '```',
              report,
              '```',
              '',
              '</details>'
            ].join('\n');

            // paginate: the default page size is 30, and this repo had 21 open
            // ops/automation issues at once. A single unpaginated page can drop
            // the very issue the dedup is looking for.
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ops,automation',
              per_page: 100
            });

            const duplicate = issues.find((issue) => issue.title.startsWith(TITLE_PREFIX));
            if (duplicate) {
              // A recurring failure appends evidence to the one open issue.
              // Doing nothing (the old behaviour on a match) would have thrown
              // the report away, which is the same evidence loss the inlining
              // above exists to stop.
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: duplicate.number,
                body: `Still failing on ${today}.\n\n${body}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ops', 'automation', 'alert']
              });
            }

  # ---------------------------------------------------------------------------
  # priority — daily cron OR dispatch profile priority.
  # Lightweight: only the blocking lint-and-types check matters; advisory
  # service checks are skipped (--skip-sentry --skip-uiux). Slack secret only,
  # contents:read. Gate default OFF (OPS_PRIORITY_LOOP_SCHEDULE == 'true').
  # ---------------------------------------------------------------------------
  priority:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 4 * * *' && vars.OPS_PRIORITY_LOOP_SCHEDULE == 'true')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'priority')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # 이 잡은 시크릿을 하나도 쓰지 않는다 — MED-2 의 가장 강한 형태다.
      # 예전에는 has-secret boolean 만 job-level 에 두고 실제 값은 "Post to Slack"
      # step 에 주는 패턴이었는데, 그 step 이 2026-09-18 에 제거됐다(한 번도 실행된
      # 적이 없었다 — AI_GATEWAY_URL/TOKEN/SLACK_CHANNEL_ID_OPS 가 전부 미등록).
      # 시크릿을 추가하려면 job-level env 가 아니라 그 step 에 스코프하고
      # test_ci_ops_orchestrator_partition_guard.py 의 zero 단언을 같이 고칠 것.
      RUN_VERCEL_CHECKS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        # ruff + mypy are required by the blocking lint-and-types check (the only
        # check that can fail this run). Without them the lint step could not run.
        # ruff is pinned to python-lint.yml's version — see the roundtable job.
        run: python -m pip install --upgrade pip pyyaml 'ruff==0.16.7' mypy

      - name: Run priority checks
        id: checks
        run: |
          set -uo pipefail
          # Capture the orchestrator's exit code instead of swallowing it with
          # `|| true`. Non-zero means a BLOCKING lint-and-types failure (rc 1=P1,
          # 2=P0); advisory service checks never set it. We still publish the
          # report to Slack below, then fail in the trailing step so a broken
          # lint/types state is a RED run, not a silent green. (Fix A-H2, audit.)
          set +e
          message=$(python3 scripts/ops_health_orchestrator.py --skip-sentry --skip-uiux)
          rc=$?
          set -e
          {
            echo "message<<EOF"
            echo "$message"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Fail run if ops health checks reported a blocking issue
        if: always()
        env:
          OPS_RC: ${{ steps.checks.outputs.rc }}
        run: |
          if [ "${OPS_RC:-0}" != "0" ]; then
            echo "::error::ops_health_orchestrator exited ${OPS_RC} (blocking lint-and-types failure; see the Slack report)."
            exit "${OPS_RC}"
          fi
          echo "ops health checks passed (rc=0)."

  # ---------------------------------------------------------------------------
  # on_demand — repository_dispatch (ai_ops_task) OR dispatch profile full.
  # This is the ONLY job reachable from the untrusted repository_dispatch path.
  # contents:read only; NO actions:write / issues:write. MED-2: secrets are
  # STEP-SCOPED (never job-level) — job env carries only non-secret toggles and
  # boolean has-secret flags. RUN_* fall back inputs -> client_payload -> 'true'.
  # ---------------------------------------------------------------------------
  on_demand:
    if: >-
      github.event_name == 'repository_dispatch'
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    # MEDIUM-2 (audit): 시크릿 값은 job-level에서 모든 step(Checkout/Setup/Install
    # 포함)에 노출하지 않는다. 비-시크릿 토글과 if: 조건용 boolean만 job-level에 두고,
    # 실제 시크릿은 이를 쓰는 step에만 부여한다.
    env:
      RUN_LINT_CHECKS: ${{ github.event.inputs.run_lint_checks || github.event.client_payload.run_lint_checks || 'true' }}
      RUN_VERCEL_CHECKS: ${{ github.event.inputs.run_vercel_checks || github.event.client_payload.run_vercel_checks || 'true' }}
      RUN_GITHUB_ACTIONS_CHECKS: ${{ github.event.inputs.run_github_actions_checks || github.event.client_payload.run_github_actions_checks || 'true' }}
      RUN_SENTRY_CHECKS: ${{ github.event.inputs.run_sentry_checks || github.event.client_payload.run_sentry_checks || 'true' }}
      RUN_UIUX_CHECKS: ${{ github.event.inputs.run_uiux_checks || github.event.client_payload.run_uiux_checks || 'true' }}
      AUTO_RECOVER_GHA: ${{ github.event.inputs.auto_recover_gha || github.event.client_payload.auto_recover_gha || 'true' }}
      # if: 조건용 boolean (시크릿 값이 아님 — 존재 여부만 노출).

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        # ruff pinned to python-lint.yml's version — see the roundtable job.
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'ruff==0.16.7' mypy
          npm i -g vercel
          gh --version
          vercel --version

      - name: Run on-demand checks
        id: checks
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          args=(--output reports/ops-roundtable.md --json-output reports/ops-roundtable.json)
          if [ "${AUTO_RECOVER_GHA}" = "true" ]; then
            args+=(--auto-recover-gha)
          fi
          mkdir -p reports
          # Capture the orchestrator's exit code instead of swallowing it with
          # `|| true`. Non-zero = BLOCKING lint-and-types failure (rc 1=P1, 2=P0);
          # advisory checks never set it. Still publish to Slack below, then fail
          # in the trailing step so a broken state is RED. (Fix A-H2, audit.)
          set +e
          message=$(python3 scripts/ops_health_orchestrator.py "${args[@]}")
          rc=$?
          set -e
          {
            echo "message<<EOF"
            echo "$message"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Fail run if ops health checks reported a blocking issue
        if: always()
        env:
          OPS_RC: ${{ steps.checks.outputs.rc }}
        run: |
          if [ "${OPS_RC:-0}" != "0" ]; then
            echo "::error::ops_health_orchestrator exited ${OPS_RC} (blocking lint-and-types failure; see the Slack report)."
            exit "${OPS_RC}"
          fi
          echo "ops health checks passed (rc=0)."
