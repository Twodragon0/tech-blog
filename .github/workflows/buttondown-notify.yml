name: Buttondown Email Notification

# 새 포스트 발행 시 Buttondown을 통해 구독자에게 이메일 발송
# 업데이트된 포스트는 이메일 발송하지 않음 (새 포스트만 발송)
# Free 티어 최적화: 조건부 실행, 타임아웃 설정

on:
  push:
    branches: [main]
    paths:
      - '_posts/**' # 포스트 변경 시에만 실행
  workflow_dispatch:
    inputs:
      post_path:
        description: 'Post file path (e.g. _posts/2026-03-09-Title.md)'
        required: true
        type: string

permissions: {}

# One group per commit (and per dispatched post), never cancelled. A group per
# branch with cancel-in-progress let a second push cancel the run that was
# mailing the first push's posts. Turning cancel-in-progress off alone is not
# enough: GitHub keeps one pending run per group, so a third push would still
# replace the second.
concurrency:
  group: buttondown-${{ github.sha }}-${{ inputs.post_path || 'push' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          # All commits, so github.event.before is here however many commits
          # the push carried. blob:none leaves out old file contents: a few MB
          # of history instead of the full 1.4 GB clone.
          fetch-depth: 0
          filter: blob:none

      - name: Check for new posts
        id: check_posts
        shell: bash  # -eo pipefail: a failing git diff fails the step
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # New posts in this push: diff from where main was before it, so a
          # push of several commits mails the posts from all of them, not only
          # the last commit's. HEAD~1 when there is no usable "before": a
          # manual run, a new branch (all zeros), or a force push that left it
          # out of HEAD's history.
          BASE=HEAD~1
          if [ "$EVENT_NAME" = push ] && [ -n "$BEFORE" ] \
            && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "$BEFORE" HEAD; then
            BASE=$BEFORE
          fi
          echo "Looking for new posts in $BASE..HEAD"

          # --diff-filter=A: only new posts are mailed, never edits or renames.
          # -z: names come out verbatim; otherwise git quotes non-ASCII ones.
          NEW_POSTS=$(git diff -z --name-only --diff-filter=A "$BASE" HEAD -- '_posts/*.md' | tr '\0' '\n')

          # The send step mails this list (POSTS_JSON) rather than diffing
          # again, so both steps agree. Each path is base64-encoded so any file
          # name survives GITHUB_OUTPUT and the environment.
          POSTS_JSON=""
          POST_COUNT=0
          while IFS= read -r post; do
            [ -n "$post" ] || continue
            echo "  new post: $post"
            POSTS_JSON="$POSTS_JSON${POSTS_JSON:+,}\"$(printf '%s' "$post" | base64 | tr -d '\n')\""
            POST_COUNT=$((POST_COUNT + 1))
          done <<< "$NEW_POSTS"

          echo "posts_json=[$POSTS_JSON]" >> "$GITHUB_OUTPUT"
          echo "post_count=$POST_COUNT" >> "$GITHUB_OUTPUT"
          if [ "$POST_COUNT" -gt 0 ]; then
            echo "Found $POST_COUNT new post(s)"
            echo "has_new_posts=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new posts found (edited posts are not mailed)"
            echo "has_new_posts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check_posts.outputs.has_new_posts == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.check_posts.outputs.has_new_posts == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          pip install pyyaml requests

      # No continue-on-error and no `|| echo` here: until 2026-11-21 both hid a
      # 401 on every run while the job showed green. Any post not confirmed
      # sent (rejected key, refused request, 429/5xx/timeout) now fails this
      # job with an ::error:: naming it. Re-send such a post with a manual run
      # (post_path); Re-run jobs would mail the posts that went out again.
      # A red run here blocks nothing else: no workflow waits on this one
      # (no workflow_run consumer, no needs:) and it has no PR trigger.
      - name: Send Buttondown Email
        if: steps.check_posts.outputs.has_new_posts == 'true' || github.event_name == 'workflow_dispatch'
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          SITE_URL: "https://2twodragon.com"
          # More mailable posts than this in one run is treated as a bulk import
          # and nothing is sent. Unset falls back to the script default (3).
          BUTTONDOWN_MAX_POSTS: ${{ vars.BUTTONDOWN_MAX_POSTS }}
          # The posts the check step found (base64 paths in a JSON array). A
          # manual run's post_path takes precedence over it.
          POSTS_JSON: ${{ steps.check_posts.outputs.posts_json }}
          # Pass the workflow_dispatch input via env (NOT inline ${{ }} in the
          # shell) so a crafted post_path cannot inject shell commands: GitHub
          # writes it as a literal string to the process env and the shell never
          # re-parses it. (Security fix B-H1, 2026-06-30 workflow audit.)
          POST_PATH: ${{ github.event.inputs.post_path }}
        run: |
          # 보안: API 키 검증
          if [ -z "$BUTTONDOWN_API_KEY" ]; then
            echo "::error::BUTTONDOWN_API_KEY is not set in GitHub Secrets (Settings → Secrets and variables → Actions)"
            exit 1
          fi

          # workflow_dispatch: 지정된 포스트 발송
          # push: check 단계가 찾은 새 포스트(POSTS_JSON) 발송
          # Both go through the batch script so the same bulk/imported guards apply.
          if [ -n "$POST_PATH" ]; then
            echo "📧 Manual dispatch: $POST_PATH"
            python3 scripts/buttondown_notify_batch.py -- "$POST_PATH"
          else
            echo "📧 Processing the posts found by the check step..."
            python3 scripts/buttondown_notify_batch.py
          fi
          
