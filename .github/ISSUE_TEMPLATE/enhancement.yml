name: 💡 개선 제안
description: 사이트 기능, 자동화 스크립트, CI 파이프라인 개선을 제안합니다.
title: "[enhancement] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        새 **포스트 주제** 제안은 [Discussions](https://github.com/Twodragon0/tech-blog/discussions)로 부탁드립니다.
        이 템플릿은 코드·인프라·자동화 개선용입니다.

  - type: dropdown
    id: area
    attributes:
      label: 대상 영역
      options:
        - 사이트 프론트엔드 (레이아웃·CSS·JS)
        - 성능 (Core Web Vitals, 캐싱, 번들)
        - 접근성 (WCAG 2.1 AA)
        - SEO · 구조화 데이터
        - 자동화 스크립트 (scripts/)
        - CI/CD 워크플로 · 품질 게이트
        - 보안 (CSP, 의존성, 시크릿 위생)
        - 기타
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 해법이 아니라 **문제**부터 적어주세요. 지금 무엇이 불편한가요?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방법
      description: 구체적인 변경안. 여러 대안이 있다면 트레이드오프도 함께.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 대안
      description: 왜 다른 방법 대신 이 방법인가요?
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: 영향 범위 · 위험
      description: |
        기존 포스트 코퍼스, 배포, CI 게이트에 미치는 영향.
        되돌리기 어려운 변경인가요?
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 확인
      options:
        - label: 기존 이슈를 검색해 중복이 아님을 확인했습니다
          required: true
